<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YAR AI — يار</title>
<meta name="theme-color" content="#131314">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YAR AI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: هادئ وواثق مثل تطبيقات الذكاء الكبيرة
   IDEA: لوحة كتابة واحدة بالنص، كل شي ثاني يختفي
   PICTURE: نجمة يار المتدرجة + صندوق الكتابة
   COLOUR: أسود دافئ، رمادي ناعم، لمسة متدرجة بنفسجي-وردي لهوية YAR
   TYPE: IBM Plex Sans Arabic، LAYOUT: قائمة جانبية + عمود محادثة ٧٦٠ */
:root{--bg:#131314;--side:#1b1b1d;--panel:#1e1f20;--panel2:#282a2c;--line:#2f3133;--text:#e8e8ea;--muted:#9a9ba0;--dim:#6b6c72;--a1:#8b5cf6;--a2:#ec4899;--a3:#f5a524;--ok:#22c55e}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{height:100%}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:16px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
.grad{background:linear-gradient(120deg,var(--a1),var(--a2) 55%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.spark{width:28px;height:28px;flex:none}
/* ===== الدخول ===== */
#auth{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(600px 400px at 50% 20%,rgba(139,92,246,.18),transparent 70%)}
.card{width:100%;max-width:380px;text-align:center}
.card .spark{width:56px;height:56px;margin:0 auto 14px}
.card h1{font-size:34px;font-weight:700;letter-spacing:-.5px}
.card p.sub{color:var(--muted);margin:6px 0 26px;font-size:15px}
.card input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:14px 16px;font-family:inherit;font-size:16px;margin-bottom:10px;direction:ltr;text-align:right;outline:none}
.card input:focus{border-color:var(--a1)}
.primary{width:100%;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(120deg,var(--a1),var(--a2))}
.primary:disabled{opacity:.5}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:600}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px;margin:16px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.link{background:none;border:0;color:var(--muted);font-size:14px;margin-top:12px;width:100%}
.link:hover{color:var(--text)}
.msg{font-size:13.5px;margin-top:10px;min-height:18px;color:var(--a3)}
/* ===== التطبيق ===== */
#app{flex:1;display:none;min-height:0}
aside{width:272px;background:var(--side);display:flex;flex-direction:column;min-height:0;transition:transform .25s}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 6px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.newbtn{display:flex;align-items:center;gap:10px;margin:8px 10px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:0;font-size:14.5px;font-weight:500}
.newbtn:hover{background:#323436}
.search{margin:4px 10px 6px;background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--text);font-family:inherit;font-size:14px;outline:none}
.side-label{color:var(--dim);font-size:12.5px;padding:10px 18px 4px}
#convs{overflow:auto;flex:1;padding:0 8px 8px}
.conv{padding:9px 12px;border-radius:10px;color:var(--muted);font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.active,.conv:hover{background:var(--panel2);color:var(--text)}
.me{border-top:1px solid var(--line);padding:10px;position:relative}
.me-btn{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;padding:8px;border-radius:12px;text-align:right}
.me-btn:hover{background:var(--panel2)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2));display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.me-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-plan{font-size:12px;color:var(--muted)}
.menu{position:absolute;bottom:64px;inset-inline:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:6px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:20}
.menu.open{display:block}
.menu button{display:flex;width:100%;gap:10px;align-items:center;background:transparent;border:0;padding:10px 12px;border-radius:10px;font-size:14.5px;text-align:right}
.menu button:hover{background:#36383b}
main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;min-height:56px}
.topbar .title{font-size:17px;font-weight:600;display:flex;gap:8px;align-items:center}
.pill{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--panel2);color:var(--muted);font-weight:500}
.pill.pro{background:rgba(139,92,246,.18);color:#c4b5fd}.pill.business{background:rgba(245,165,36,.16);color:#fcd38d}
.ibtn{background:transparent;border:0;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;color:var(--muted)}
.ibtn:hover{background:var(--panel2);color:var(--text)}
#menuBtn{display:none}
#expiryBar{background:rgba(245,165,36,.12);color:#fcd38d;text-align:center;font-size:13px;padding:7px 10px}
#chat{flex:1;overflow:auto;padding:8px 16px 24px;scroll-behavior:smooth}
main.empty{justify-content:center}
main.empty #chat{flex:none;overflow:visible;padding-bottom:10px}
main.empty .topbar{position:absolute;top:0;inset-inline:0}
.hello{max-width:760px;margin:0 auto 18px;padding:0 4px}
.hello h2{font-size:clamp(28px,5vw,40px);font-weight:600;letter-spacing:-.5px;line-height:1.2}
.hello p{color:var(--dim);font-size:clamp(22px,4vw,32px);font-weight:500;margin-top:2px}
/* الرسائل */
.msgrow{max-width:760px;margin:0 auto 26px}
.msgrow.user{display:flex;justify-content:flex-start}
.msgrow.user .body{background:var(--panel2);padding:10px 16px;border-radius:20px 20px 6px 20px;max-width:85%;white-space:pre-wrap;line-height:1.75}
.msgrow.ai{display:flex;gap:12px}
.msgrow.ai .spark{margin-top:2px}
.msgrow.ai .col{flex:1}
.msgrow.ai .body{line-height:1.9;font-size:16px}
.body p{margin:0 0 12px}.body p:last-child{margin:0}
.body h1,.body h2,.body h3{margin:18px 0 8px;line-height:1.4}.body h1{font-size:22px}.body h2{font-size:19px}.body h3{font-size:17px}
.body ul,.body ol{margin:6px 0 12px;padding-inline-start:22px}.body li{margin:3px 0}
.body strong{color:#fff}
.body code{background:var(--panel2);padding:1px 6px;border-radius:6px;font-size:14px;direction:ltr;unicode-bidi:embed}
.body pre{background:#0d0d0e;border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;margin:10px 0;direction:ltr;text-align:left}
.body pre code{background:none;padding:0;font-size:13.5px;line-height:1.6}
.body table{border-collapse:collapse;margin:10px 0;display:block;overflow-x:auto;font-size:14.5px}
.body th,.body td{border:1px solid var(--line);padding:7px 11px;text-align:right}.body th{background:var(--panel)}
.body blockquote{border-inline-start:3px solid var(--a1);padding-inline-start:12px;color:var(--muted);margin:8px 0}
.body a{color:#c4b5fd}
.tools{margin-top:8px;display:flex;gap:2px}
.tools button{background:transparent;border:0;color:var(--dim);border-radius:8px;font-size:13px;padding:5px 8px}
.tools button:hover{background:var(--panel2);color:var(--text)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px}
.thinking .spark{animation:spin 2.4s linear infinite}
.shimmer{background:linear-gradient(90deg,var(--dim) 0%,var(--text) 50%,var(--dim) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.err{color:#fca5a5}
.att{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:12px;padding:5px 10px;font-size:12.5px;color:var(--muted);max-width:200px}
.att span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.att button{background:none;border:0;color:var(--dim);font-size:14px}
.body img{max-width:100%;border-radius:16px;margin:8px 0;display:block;background:var(--panel2);min-height:120px}
.catchip.on{background:linear-gradient(120deg,rgba(139,92,246,.25),rgba(236,72,153,.25));border-color:var(--a2);color:var(--text)}
/* صندوق الكتابة */
form#composer{padding:0 16px calc(12px + env(safe-area-inset-bottom))}
.box{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:12px 14px 10px;transition:border-color .2s;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.box:focus-within{border-color:#45474b}
textarea{width:100%;background:transparent;border:0;color:var(--text);font-family:inherit;font-size:16px;resize:none;max-height:220px;padding:4px 6px;outline:none;line-height:1.6}
textarea::placeholder{color:var(--dim)}
.box-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:8px}
.catchip{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none;background:transparent;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13.5px;color:var(--muted);position:relative}
.catchip:hover{color:var(--text);background:var(--panel2)}
.send{border:0;border-radius:50%;width:40px;height:40px;background:var(--text);color:#111;font-size:18px;display:grid;place-items:center;flex:none}
.send:disabled{background:var(--panel2);color:var(--dim)}
.catmenu{position:absolute;bottom:calc(100% + 8px);inset-inline-start:0;width:290px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:6px;display:none;z-index:30;box-shadow:0 16px 50px rgba(0,0,0,.55);text-align:right}
.catmenu.open{display:block}
.catmenu button{display:flex;gap:12px;width:100%;align-items:flex-start;background:transparent;border:0;padding:10px;border-radius:12px}
.catmenu button:hover,.catmenu button.on{background:#36383b}
.catmenu .ic{font-size:20px;line-height:1.2}
.catmenu b{display:block;font-size:14.5px;font-weight:600;color:var(--text)}
.catmenu small{color:var(--muted);font-size:12.5px}
.meta{max-width:760px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--dim)}
#sugg{width:100%;max-width:760px;margin:14px auto 0;align-self:center;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 16px}
#sugg button{background:transparent;border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:13.5px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sugg button:hover{background:var(--panel2);color:var(--text)}
main:not(.empty) #sugg{display:none}
footer.credit{text-align:center;font-size:11.5px;color:var(--dim);padding:2px 0 8px}
.scrim{display:none}
@media (max-width:800px){
  aside{position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:40;transform:translateX(100%);width:84%;max-width:310px;box-shadow:0 0 60px rgba(0,0,0,.6)}
  aside.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
  #menuBtn{display:grid}
  .catmenu{width:min(290px,80vw)}
}
/* ===== النوافذ (الباقات، الذاكرة، لوحة التحكم) ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.show{display:flex}
.modal{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:24px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.overlay{align-items:center}.modal{border-radius:24px}}
.modal h3{font-size:21px;margin-bottom:4px;font-weight:600}.modal .sub{color:var(--muted);font-size:13.5px;margin-bottom:14px;line-height:1.7}
.x{position:absolute;top:14px;left:14px;background:var(--panel2);border:0;width:34px;height:34px;border-radius:50%}
.icon-btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.plan{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--bg);cursor:pointer}
.plan.sel{border-color:var(--a1);box-shadow:0 0 0 2px rgba(139,92,246,.3)}
.plan.cur{opacity:.8}
.plan .p{font-size:22px;font-weight:700}.plan .p small{font-size:12px;color:var(--muted);font-weight:500}
.plan ul{list-style:none;font-size:13px;color:var(--muted);margin-top:6px;line-height:1.9}
.pay{background:var(--bg);border:1px dashed var(--a3);border-radius:14px;padding:12px;font-size:14px;line-height:1.9;margin-bottom:10px}
.pay b{color:var(--a3);direction:ltr;unicode-bidi:embed}
.field{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px;font-family:inherit;font-size:16px;margin-bottom:8px;outline:none}
.field:focus{border-color:var(--a1)}
.tabs{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.tabs button{background:var(--bg);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 14px;font-size:13px}
.tabs button.on{color:var(--text);border-color:var(--a1)}
.row{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;background:var(--bg)}
.row .t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.row .em{direction:ltr;font-weight:600;word-break:break-all}
.row .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.row .acts button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:5px 10px;font-size:12.5px}
.row .acts button.ok{background:#166534;border-color:#166534}.row .acts button.no{background:#7f1d1d;border-color:#7f1d1d}
.badge{font-size:11.5px;padding:2px 9px;border-radius:20px;background:var(--panel2);color:var(--muted)}
.badge.pro{background:rgba(139,92,246,.2);color:#c4b5fd}.badge.business{background:rgba(245,165,36,.18);color:#fcd38d}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:22px}.stats span{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#printBox{display:none}
@media print{
  body.printing{background:#fff!important;color:#111;overflow:visible;display:block}
  body.printing > *:not(#printBox){display:none!important}
  body.printing #printBox{display:block}
  @page{size:A4;margin:16mm 14mm}
  .pdf{font-family:'IBM Plex Sans Arabic',sans-serif;color:#1a1a1a;font-size:12.5pt;line-height:1.9;direction:rtl}
  .pdf h1{font-size:20pt;color:#5b21b6;margin:0 0 10px}
  .pdf h2{font-size:15pt;color:#6d28d9;margin:18px 0 6px;border-bottom:1px solid #e9e3fb;padding-bottom:3px;break-after:avoid}
  .pdf h3{font-size:13pt;margin:12px 0 4px;break-after:avoid}
  .pdf p{margin:0 0 8px}.pdf ul,.pdf ol{margin:4px 0 10px;padding-right:22px}
  .pdf table{border-collapse:collapse;width:100%;margin:8px 0}.pdf th,.pdf td{border:1px solid #bbb;padding:5px 8px;text-align:right}.pdf th{background:#f3effe}
  .pdf pre{direction:ltr;text-align:left;background:#f5f5f5;padding:8px;border-radius:6px;white-space:pre-wrap;font-size:10pt}
  .pdf strong{color:#000}.pdf li,.pdf tr{break-inside:avoid}
  .pdf .foot{margin-top:20px;border-top:1px solid #ddd;padding-top:6px;font-size:9pt;color:#888;text-align:center}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="yg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#ec4899"/><stop offset="1" stop-color="#f5a524"/></linearGradient>
  <symbol id="spark" viewBox="0 0 24 24"><path fill="url(#yg)" d="M12 1.5c.6 5.6 4.9 9.9 10.5 10.5-5.6.6-9.9 4.9-10.5 10.5C11.4 16.9 7.1 12.6 1.5 12 7.1 11.4 11.4 7.1 12 1.5z"/></symbol>
</defs></svg>

<section id="auth">
  <div class="card">
    <svg class="spark"><use href="#spark"/></svg>
    <h1>YAR <span class="grad">AI</span></h1>
    <p class="sub">ذكاء اصطناعي عراقي يحچي بلهجتك ويساعدك بكل شغلك</p>
    <button class="gbtn" id="googleBtn" type="button"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg> الدخول بحساب Google</button>
    <div class="or" id="orLine"><span>أو بالإيميل</span></div>
    <input id="email" type="email" placeholder="الإيميل" autocomplete="email">
    <input id="pass" type="password" placeholder="كلمة السر (٦ أحرف أو أكثر)" autocomplete="current-password">
    <div id="captcha" style="display:flex;justify-content:center;margin:2px 0 8px"></div>
    <button class="primary" id="authBtn">دخول</button>
    <button class="link" id="forgotBtn">نسيت كلمة السر؟</button>
    <button class="link" id="toggleAuth" style="margin-top:4px">ما عندك حساب؟ سوّي حساب جديد</button>
    <div class="msg" id="authMsg"></div>
  </div>
</section>

<div id="app">
  <div class="scrim" id="scrim"></div>
  <aside id="side">
    <div class="side-top">
      <div class="brand"><svg class="spark"><use href="#spark"/></svg>YAR AI</div>
    </div>
    <button class="newbtn" id="newChat"><span style="font-size:18px">＋</span> محادثة جديدة</button>
    <input class="search" id="convSearch" placeholder="ابحث بمحادثاتك">
    <div class="side-label">الأخيرة</div>
    <div id="convs"></div>
    <div class="me">
      <div class="menu" id="meMenu">
        <button id="memBtn">🧠 ذاكرتي وملفي</button>
        <button id="planBtn">⭐ الباقات والاشتراك</button>
        <button id="adminBtn" style="display:none">🛠️ لوحة التحكم</button>
        <button id="logoutBtn">↩️ تسجيل خروج</button>
      </div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { marked } from "https://esm.sh/marked@12.0.2";
import DOMPurify from "https://esm.sh/dompurify@3.1.6";
marked.setOptions({ breaks: true, gfm: true });
const BUILD = "__BUILD__";
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
const SUPABASE_URL = "https://wnjhsgjctevpaftvlcyr.supabase.co";
const SUPABASE_KEY = "sb_publishable_qKc7vKrYAyUe0trChcVZuA_p-bBSubV";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
let signup = false, convId = null, busy = false, imgMode = false;

const STARTERS = [
  ["✍️ كابشن إعلان", "اكتبلي كابشن انستغرام لعرض الجمعة السوداء لصيدلية، باللهجة العراقية وقصير وجذاب"],
  ["🎨 فكرة تصميم", "أريد فكرة تصميم بوستر لمطعم مشويات عراقي: النص، الألوان، الترتيب، وبرومبت صورة بالإنكليزي"],
  ["📋 خطة مشروع", "سويلي خطة مختصرة لفتح محل اكسسوارات موبايل بكركوك"],
  ["📩 رسالة رسمية", "اكتبلي رسالة رسمية لمدير الدائرة أطلب بيها إجازة ثلاث أيام"],
];

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function fmt(s){ try { return DOMPurify.sanitize(marked.parse(s)); } catch { return esc(s); } }

let CATS = [], curCat = "general", PROF = {};
const catOf = id => CATS.find(c=>c.id===id) || { id:"general", name:"عام", icon:"💬", starters:[], blurb:"" };
const SPARK = `<svg class="spark"><use href="#spark"/></svg>`;
function greet(){ const h = new Date().getHours(); return h < 12 ? "صباح الخير" : "مساء الخير"; }
function welcome(){
  $("main").classList.add("empty");
  const n = PROF.full_name ? "، " + esc(PROF.full_name.split(" ")[0]) : "";
  $("chat").innerHTML = `<div class="hello"><h2><span class="grad">${greet()}${n}</span></h2><p>شنو نسوي اليوم؟</p></div>`;
  const c = catOf(curCat);
  $("sugg").innerHTML = (c.starters||[]).map((s,i)=>`<button data-i="${i}">${c.icon} ${esc(s)}</button>`).join("");
  $("sugg").querySelectorAll("button").forEach(b=>b.onclick=()=>{ $("input").value = c.starters[b.dataset.i]; autosize(); $("input").focus(); });
}
function setCatLabel(){
  const c = catOf(curCat); $("catLabel").textContent = `${c.icon} ${c.name}`;
  $("catMenu").innerHTML = CATS.map(x=>`<button type="button" data-c="${x.id}" class="${x.id===curCat?'on':''}"><span class="ic">${x.icon}</span><span><b>${x.name}</b><small>${esc(x.blurb||'')}</small></span></button>`).join("");
  $("catMenu").querySelectorAll("[data-c]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); curCat=b.dataset.c; $("catMenu").classList.remove("open"); setCatLabel(); if (!convId) welcome(); });
}
function bubble(role, text){
  $("main").classList.remove("empty");
  if ($("chat").querySelector(".hello")) $("chat").innerHTML = "";
  const d = document.createElement("div");
  if (role === "user") {
    d.className = "msgrow user"; d.innerHTML = `<div class="body"></div>`; d.querySelector(".body").textContent = text;
  } else {
    d.className = "msgrow ai"; d.innerHTML = `${SPARK}<div class="col"><div class="body"></div></div>`;
    const body = d.querySelector(".body");
    if (text === null) body.innerHTML = `<div class="thinking"><span class="shimmer">يار يفكر…</span></div>`;
    else { body.innerHTML = fmt(text); addCopy(d, text); }
  }
  $("chat").appendChild(d); $("chat").scrollTop = $("chat").scrollHeight;
  return d;
}
function addCopy(d, text){
  const t = document.createElement("div"); t.className = "tools";
  t.innerHTML = `<button title="نسخ">⧉ نسخ</button><button title="حفظ كـ PDF">⬇ PDF</button>`;
  const [cp, pdf] = t.querySelectorAll("button");
  cp.onclick = async () => { try { await navigator.clipboard.writeText(text); cp.textContent = "✓ انسخ"; setTimeout(()=>cp.textContent="⧉ نسخ",1500); } catch {} };
  pdf.onclick = () => makePdf(text);
  const im = text.match(/!\[[^\]]*\]\((\S+?)\)/);
  if (im) { const a = document.createElement("a"); a.href = im[1]; a.target = "_blank"; a.rel = "noopener"; a.innerHTML = `<button>🖼️ افتح الصورة</button>`; t.appendChild(a); }
  d.querySelector(".col").appendChild(t);
}

/* ===== تحويل الجواب لـ PDF (عن طريق طباعة المتصفح: عربي نظيف ومجاني) ===== */
function makePdf(text){
  let box = $("printBox");
  if (!box) { box = document.createElement("div"); box.id = "printBox"; document.body.appendChild(box); }
  box.innerHTML = `<div class="pdf">${fmt(text)}<div class="foot">صُنع بواسطة YAR AI · YAR Studio</div></div>`;
  const t = (text.match(/^#\s+(.+)$/m)?.[1] || "YAR AI").replace(/[#*]/g,"").trim().slice(0,60);
  const oldTitle = document.title; document.title = t;
  document.body.classList.add("printing");
  setTimeout(() => { window.print(); setTimeout(() => { document.body.classList.remove("printing"); document.title = oldTitle; }, 500); }, 100);
}

/* ===== رفع الملفات (PDF، صور، نص) ===== */
let ATT = [];
function renderAtt(){
  $("attList").innerHTML = ATT.map((f,i)=>`<div class="att">${f.mime.startsWith("image/")?"🖼️":"📄"}<span>${esc(f.name)}</span><button type="button" data-x="${i}">✕</button></div>`).join("");
  $("attList").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{ ATT.splice(+b.dataset.x,1); renderAtt(); });
}
$("attBtn").onclick = () => $("fileIn").click();
$("fileIn").onchange = async () => {
  for (const f of [...$("fileIn").files].slice(0, 4 - ATT.length)) {
    if (f.size > 4 * 1024 * 1024) { alertBox(`الملف «${f.name}» أكبر من ٤ ميگا`); continue; }
    const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(",")[1]); fr.readAsDataURL(f); });
    ATT.push({ name: f.name, mime: f.type || "application/octet-stream", data });
  }
  $("fileIn").value = ""; renderAtt();
};
function alertBox(m){ $("remain").textContent = "⚠️ " + m + " ·"; }

/* ===== الدخول بـ Google + حماية Turnstile ===== */
const TURNSTILE_SITEKEY = "";   // يتعبّى بعد ما تسوي حساب Cloudflare Turnstile
let captchaToken = null;
if (TURNSTILE_SITEKEY) {
  window.onTurnstile = () => window.turnstile.render("#captcha", { sitekey: TURNSTILE_SITEKEY, theme: "dark", callback: t => captchaToken = t });
  const s = document.createElement("script"); s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstile"; s.async = true; document.head.appendChild(s);
}
$("googleBtn").onclick = async () => {
  $("authMsg").textContent = "لحظة…";
  const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } });
  if (error) $("authMsg").textContent = /not enabled|Unsupported provider/i.test(error.message) ? "الدخول بـ Google بعده ما متفعّل، استخدم الإيميل لهسه" : error.message;
};
function closeSide(){ $("side").classList.remove("open"); $("scrim").classList.remove("open"); }
$("menuBtn").onclick = () => { $("side").classList.add("open"); $("scrim").classList.add("open"); };
$("scrim").onclick = closeSide;
$("imgBtn").onclick = () => {
  imgMode = !imgMode; $("imgBtn").classList.toggle("on", imgMode);
  $("input").placeholder = imgMode ? "اوصف الصورة اللي تريدها… مثلاً: بوستر لصيدلية بألوان خضراء ويا بنت كردية" : "اسأل يار أي شي…";
  $("input").focus();
};
$("catBtn").onclick = e => { e.stopPropagation(); $("catMenu").classList.toggle("open"); };
$("meBtn").onclick = e => { e.stopPropagation(); $("meMenu").classList.toggle("open"); };
document.addEventListener("click", () => { $("catMenu").classList.remove("open"); $("meMenu").classList.remove("open"); });
$("meMenu").addEventListener("click", () => { $("meMenu").classList.remove("open"); closeSide(); });
$("convSearch").oninput = () => { const q = $("convSearch").value.trim(); document.querySelectorAll("#convs .conv").forEach(el => el.style.display = el.textContent.includes(q) ? "" : "none"); };

async function loadConvs(){
  const { data } = await sb.from("conversations").select("id,title,category").order("updated_at",{ascending:false}).limit(50);
  $("convs").innerHTML = "";
  (data||[]).forEach(c=>{
    const el = document.createElement("div");
    el.className = "conv" + (c.id === convId ? " active" : "");
    el.textContent = `${catOf(c.category).icon} ${c.title}`; el.onclick = () => openConv(c.id, c.category);
    $("convs").appendChild(el);
  });
}
const saveConv = () => { try { convId ? localStorage.setItem("yar_conv", JSON.stringify({ id: convId, cat: curCat })) : localStorage.removeItem("yar_conv"); } catch {} };
async function openConv(id, cat){
  convId = id; saveConv(); curCat = cat || "general"; setCatLabel(); closeSide();
  const { data } = await sb.from("messages").select("role,content").eq("conversation_id", id).order("created_at");
  $("chat").innerHTML = "";
  (data||[]).forEach(m=>bubble(m.role, m.content));
  if (!data?.length) welcome();
  loadConvs();
}
async function send(){
  const text = $("input").value.trim();
  const files = imgMode ? [] : ATT.slice();
  if ((!text && !files.length) || busy) return;
  ATT = []; renderAtt();
  busy = true; $("sendBtn").disabled = true; $("input").value = ""; autosize();
  bubble("user", files.length ? `📎 ${files.map(f=>f.name).join("، ")}\n${text}` : text);
  const pending = bubble("ai", null); if (imgMode) pending.querySelector(".shimmer").textContent = "يار يرسم الصورة… (تاخذ ثواني)";
  try {
    const { data, error } = await sb.functions.invoke(imgMode ? "image" : "chat", { body: { conversation_id: convId, message: text, category: curCat, files } });
    let reply, err, upgrade = false;
    if (error) { try { const j = await error.context.json(); err = j.error; upgrade = !!j.upgrade; } catch { err = "صار خلل بالاتصال، جرّب مرة ثانية"; } }
    else reply = data.reply;
    const body = pending.querySelector(".body");
    if (err) {
      body.innerHTML = `<span class="err">⚠️ ${esc(err)}</span>` + (upgrade ? `<br><button class="primary" style="margin-top:10px;width:auto;padding:8px 18px">⭐ شوف الباقات</button>` : "");
      const ub = body.querySelector("button"); if (ub) ub.onclick = () => showPlans();
    }
    else {
      body.innerHTML = fmt(reply); addCopy(pending, reply);
      const isNew = !convId; convId = data.conversation_id; saveConv();
      if (typeof data.remaining === "number") $("remain").textContent = `باقي اليوم ${data.remaining} رسالة ·`;
      if (typeof data.remaining_images === "number") $("remain").textContent = `باقي اليوم ${data.remaining_images} صور ·`;
      if (isNew) loadConvs();
    }
  } finally { busy = false; $("sendBtn").disabled = false; $("chat").scrollTop = $("chat").scrollHeight; }
}
function autosize(){ const t=$("input"); t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,180)+"px"; }

$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 760) { e.preventDefault(); send(); } });
$("composer").onsubmit = e => { e.preventDefault(); send(); };
const newChat = () => { convId = null; saveConv(); setCatLabel(); welcome(); loadConvs(); closeSide(); $("input").focus(); };
$("newChat").onclick = newChat; $("newChat2").onclick = newChat;
$("toggleAuth").onclick = () => {
  signup = !signup;
  $("authBtn").textContent = signup ? "سوّي حساب" : "دخول";
  $("toggleAuth").textContent = signup ? "عندك حساب؟ سجّل دخول" : "ما عندك حساب؟ سوّي حساب جديد";
  $("authMsg").textContent = "";
};
$("authBtn").onclick = async () => {
  const email = $("email").value.trim(), password = $("pass").value;
  if (!email || password.length < 6) { $("authMsg").textContent = "اكتب إيميل صحيح وكلمة سر ٦ أحرف أو أكثر"; return; }
  $("authBtn").disabled = true; $("authMsg").textContent = "لحظة…";
  const r = signup ? await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname, captchaToken } }) : await sb.auth.signInWithPassword({ email, password, options: { captchaToken } });
  $("authBtn").disabled = false;
  if (r.error) { $("authMsg").textContent = /Invalid login/i.test(r.error.message) ? "الإيميل أو كلمة السر غلط" : r.error.message; return; }
  if (signup && !r.data.session) $("authMsg").textContent = "✅ دزّينالك رسالة تأكيد على الإيميل، افتحها وبعدين سجّل دخول";
  if (/already registered/i.test(r.error?.message||"")) $("authMsg").textContent = "هذا الإيميل عنده حساب، سجّل دخول";
};
$("logoutBtn").onclick = () => sb.auth.signOut();
$("forgotBtn").onclick = async () => {
  const email = $("email").value.trim();
  if (!email.includes("@")) { $("authMsg").textContent = "اكتب إيميلك فوگ أول، وبعدين اضغط «نسيت كلمة السر؟»"; return; }
  $("authMsg").textContent = "لحظة…";
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname, captchaToken });
  $("authMsg").textContent = error ? "ما انرسل، جرّب بعد شوية" : "✅ دزّينالك رابط على إيميلك. افتحه وتطلعلك خانة كلمة سر جديدة (إذا ما لگيته شوف السبام).";
};
function showNewPassword(){
  openModal(`<h3>🔑 كلمة سر جديدة</h3><div class="sub">اكتب كلمة سر جديدة (٦ أحرف أو أكثر).</div>
    <input class="field" id="np1" type="password" placeholder="كلمة السر الجديدة" dir="ltr">
    <input class="field" id="np2" type="password" placeholder="أعدها مرة ثانية" dir="ltr">
    <button class="primary" id="saveNp">حفظ</button><div class="msg" id="npMsg"></div>`);
  $("saveNp").onclick = async () => {
    const a = $("np1").value, b = $("np2").value;
    if (a.length < 6) { $("npMsg").textContent = "لازم ٦ أحرف أو أكثر"; return; }
    if (a !== b) { $("npMsg").textContent = "الكلمتين مو متطابقات"; return; }
    const { error } = await sb.auth.updateUser({ password: a });
    $("npMsg").textContent = error ? "ما انحفظت، جرّب مرة ثانية" : "✅ تغيّرت كلمة السر";
    if (!error) setTimeout(closeModal, 1200);
  };
}

/* ===== الاشتراكات ===== */
let PLANS = [], SETTINGS = {}, ME = null, IS_ADMIN = false;
const iqd = n => n.toLocaleString("ar-IQ") + " دينار";
const dateAr = d => new Date(d).toLocaleDateString("ar-IQ", { year:"numeric", month:"long", day:"numeric" });
function openModal(html){ $("modalBody").innerHTML = html; $("overlay").classList.add("show"); }
function closeModal(){ $("overlay").classList.remove("show"); }
$("closeModal").onclick = closeModal;
$("overlay").onclick = e => { if (e.target.id === "overlay") closeModal(); };

async function loadAccount(){
  const uid = (await sb.auth.getUser()).data.user?.id;
  const [p, s, me, adm] = await Promise.all([
    sb.from("plans").select("*").order("sort"),
    sb.from("settings").select("key,value"),
    sb.from("profiles").select("plan,plan_until,full_name,category,specialty,institution,stage,city,about,onboarded").eq("user_id", uid).maybeSingle(),
    sb.rpc("is_admin"),
  ]);
  PLANS = p.data || []; SETTINGS = Object.fromEntries((s.data||[]).map(r=>[r.key,r.value]));
  ME = me.data || { plan:"free" }; IS_ADMIN = !!adm.data; PROF = me.data || {};
  if (PROF.category && !convId && !localStorage.getItem("yar_conv")) { curCat = PROF.category; setCatLabel(); welcome(); }
  if (me.data && !PROF.onboarded) { const go = () => CATS.length ? showProfile(true) : setTimeout(go, 200); go(); }
  const active = ME.plan !== "free" && ME.plan_until && new Date(ME.plan_until) > new Date();
  if (!active) ME.plan = "free";
  const cur = PLANS.find(x=>x.id===ME.plan);
  const pname = cur?.name || "مجاني";
  $("planPill").textContent = pname; $("planPill").className = "pill " + ME.plan;
  $("mePlan").textContent = ME.plan === "free" ? "مجاني · اشترك ⭐" : "باقة " + pname;
  $("meName").textContent = PROF.full_name || (await sb.auth.getUser()).data.user?.email || "حسابي";
  $("meAv").textContent = (PROF.full_name || "؟").trim().charAt(0);
  $("adminBtn").style.display = IS_ADMIN ? "flex" : "none";
  const left = active ? (new Date(ME.plan_until) - new Date()) / 864e5 : 99;
  $("expiryBar").style.display = left <= 2 ? "block" : "none";
  if (left <= 2) $("expiryBar").textContent = `⏰ اشتراكك ينتهي ${dateAr(ME.plan_until)}. جدّده حتى ما يرجع للمجاني.`;
}

function planCard(pl, sel){
  return `<div class="plan ${sel?'sel':''} ${pl.id===ME.plan?'cur':''}" data-id="${pl.id}">
    <div style="font-weight:800">${pl.name} ${pl.id===ME.plan?'<span class="badge">باقتك</span>':''}</div>
    <div class="p">${pl.price_iqd ? pl.price_iqd.toLocaleString("ar-IQ") : "٠"} <small>${pl.price_iqd?'دينار / شهر':'مجاناً'}</small></div>
    <ul><li>• ${pl.daily_limit} رسالة باليوم</li><li>• ${pl.review?'مراجع ذاتي يقلل الأخطاء':'محادثة وكتابة'}</li>${pl.id==='business'?'<li>• أولوية بالميزات الجديدة</li>':''}</ul></div>`;
}
async function showPlans(selId){
  const { data: reqs } = await sb.from("payment_requests").select("plan,status,created_at").order("created_at",{ascending:false}).limit(1);
  const pending = reqs?.[0]?.status === "pending";
  const paid = PLANS.filter(p=>p.price_iqd>0);
  const sel = selId || (paid.find(p=>p.id!==ME.plan)?.id ?? paid[0]?.id);
  const selPlan = PLANS.find(p=>p.id===sel);
  openModal(`<h3>باقات YAR AI</h3>
    <div class="sub">${ME.plan==='free'?'إنت هسه على الباقة المجانية.':`باقتك: ${PLANS.find(p=>p.id===ME.plan)?.name}، تنتهي ${dateAr(ME.plan_until)}.`}</div>
    <div class="plans">${PLANS.map(p=>planCard(p,p.id===sel)).join("")}</div>
    ${pending ? `<div class="pay">⏳ طلبك وصلنا وراح يتفعّل خلال ساعات بإذن الله.</div>` : `
    <div class="pay">للاشتراك بباقة <b>${selPlan.name}</b> حوّل <b>${iqd(selPlan.price_iqd)}</b><br>
      عن طريق ${esc(SETTINGS.payment_method||'زين كاش')} على الرقم: <b>${esc(SETTINGS.payment_number||'—')}</b><br>
      وبعدها اكتب رقمك اللي حوّلت منه هنا، ونفعّل اشتراكك لمدة شهر.</div>
    <input class="field" id="sender" inputmode="tel" placeholder="رقمك اللي حوّلت منه" dir="ltr">
    <input class="field" id="pnote" placeholder="ملاحظة (اختياري)">
    <button class="primary" id="sendReq">حوّلت، فعّلولي الاشتراك</button>
    <div class="msg" id="reqMsg"></div>`}`);
  $("modalBody").querySelectorAll(".plan").forEach(el=>el.onclick=()=>{ if (PLANS.find(p=>p.id===el.dataset.id).price_iqd>0) showPlans(el.dataset.id); });
  const btn = $("sendReq"); if (!btn) return;
  btn.onclick = async () => {
    const sender = $("sender").value.trim();
    if (sender.replace(/\D/g,"").length < 10) { $("reqMsg").textContent = "اكتب رقم موبايل صحيح"; return; }
    btn.disabled = true;
    const { error } = await sb.from("payment_requests").insert({ plan: sel, sender, note: $("pnote").value.trim() || null });
    btn.disabled = false;
    if (error) { $("reqMsg").textContent = "ما انرسل، جرّب مرة ثانية"; return; }
    showPlans(sel);
  };
}
$("planBtn").onclick = () => showPlans();

/* ===== الذاكرة ===== */
async function showMemory(){
  const { data } = await sb.from("memories").select("id,fact,category,created_at").order("created_at",{ascending:false});
  openModal(`<h3>🧠 ذاكرتي</h3><div class="sub">يار يتعلم عنك تلقائياً من محادثاتك (تخصصك، شغلك، مشاريعك) حتى ما تعيد نفسك. تگدر تضيف أو تمسح أي شي.</div>
    <button class="icon-btn" id="editProf" style="margin-bottom:10px">👤 تعديل ملفي الشخصي${PROF.full_name ? ` (${esc(PROF.full_name)})` : ''}</button>
    <input class="field" id="newMem" placeholder="مثلاً: طالب مرحلة رابعة هندسة مدني بجامعة كركوك">
    <button class="primary" id="addMem">أضف للذاكرة</button>
    <div style="margin-top:12px">${(data||[]).map(m=>`<div class="row"><div class="t"><span>${esc(m.fact)}</span><span class="badge">${catOf(m.category).icon}</span></div><div class="acts"><button class="no" data-del="${m.id}">مسح</button></div></div>`).join("") || '<div class="sub">لهسه ماكو شي محفوظ.</div>'}</div>`);
  $("editProf").onclick = () => showProfile(false);
  $("addMem").onclick = async () => { const f = $("newMem").value.trim(); if (!f) return; await sb.from("memories").insert({ fact: f.slice(0,300), category: curCat }); showMemory(); };
  $("modalBody").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ await sb.from("memories").delete().eq("id",b.dataset.del); showMemory(); });
}
$("memBtn").onclick = showMemory;

/* ===== الملف الشخصي (يطلع أول مرة يسجّل) ===== */
const PF = [
  ["full_name","اسمك","مثلاً: عبدالرحمن طاهر"],
  ["specialty","تخصصك أو شغلك","مثلاً: هندسة مدني / تمريض / مبرمج ويب"],
  ["institution","جامعتك أو مكان شغلك","مثلاً: جامعة كركوك"],
  ["stage","المرحلة أو سنين الخبرة","مثلاً: مرحلة رابعة / ماجستير / ٥ سنين خبرة"],
  ["city","مدينتك","مثلاً: كركوك"],
  ["about","شي تحب يار يعرفه عنك (اختياري)","مثلاً: أشتغل على بحث تخرج عن الطاقة الشمسية، وأحب الأجوبة مختصرة"],
];
function showProfile(first){
  openModal(`<h3>${first ? "أهلاً بيك بـ YAR AI 👋" : "👤 ملفي"}</h3>
    <div class="sub">${first ? "عرّفنا بنفسك حتى يار يشتغل وياك على مستواك ويتذكرك بكل محادثة." : "يار يستخدم هذي المعلومات بكل محادثاتك."}</div>
    <label class="sub">مجالك الأساسي</label>
    <select class="field" id="pf_category">${CATS.map(c=>`<option value="${c.id}" ${c.id===(PROF.category||curCat)?'selected':''}>${c.icon} ${c.name}</option>`).join("")}</select>
    ${PF.map(([k,l,ph])=>`<label class="sub">${l}</label>${k==='about'?`<textarea class="field" id="pf_${k}" rows="3" placeholder="${ph}">${esc(PROF[k]||'')}</textarea>`:`<input class="field" id="pf_${k}" placeholder="${ph}" value="${esc(PROF[k]||'')}">`}`).join("")}
    <button class="primary" id="saveProf">حفظ</button>${first?'<button class="link" id="skipProf">بعدين</button>':''}<div class="msg" id="profMsg"></div>`);
  $("saveProf").onclick = async () => {
    const row = { onboarded: true, category: $("pf_category").value };
    PF.forEach(([k]) => row[k] = ($("pf_"+k).value || "").trim().slice(0, 400) || null);
    if (!row.full_name || !row.specialty) { $("profMsg").textContent = "اكتب اسمك وتخصصك على الأقل"; return; }
    const uid = (await sb.auth.getUser()).data.user.id;
    const { error } = await sb.from("profiles").update(row).eq("user_id", uid);
    if (error) { $("profMsg").textContent = "ما انحفظ، جرّب مرة ثانية"; return; }
    PROF = { ...PROF, ...row }; curCat = row.category; setCatLabel(); closeModal(); if (!convId) welcome(); loadAccount();
  };
  const sk = $("skipProf"); if (sk) sk.onclick = closeModal;
}

/* ===== لوحة التحكم ===== */
let adminTab = "requests";
async function showAdmin(){
  const [u, r] = await Promise.all([
    sb.rpc("admin_users"),
    sb.from("payment_requests").select("id,user_id,plan,sender,note,status,created_at").order("created_at",{ascending:false}).limit(200),
  ]);
  const users = u.data || [], reqs = r.data || [];
  const byId = Object.fromEntries(users.map(x=>[x.user_id,x]));
  const pend = reqs.filter(x=>x.status==="pending");
  const paying = users.filter(x=>x.plan!=="free");
  const income = paying.reduce((s,x)=>s+(PLANS.find(p=>p.id===x.plan)?.price_iqd||0),0);
  let body = "";
  if (adminTab === "requests") {
    body = pend.length ? pend.map(q=>`<div class="row"><div class="t"><span class="em">${esc(byId[q.user_id]?.email||'—')}</span><span class="badge ${q.plan}">${PLANS.find(p=>p.id===q.plan)?.name}</span></div>
      <div>حوّل من: <b dir="ltr">${esc(q.sender)}</b> · ${dateAr(q.created_at)}</div>${q.note?`<div style="color:var(--muted)">${esc(q.note)}</div>`:''}
      <div class="acts"><button class="ok" data-act="approve" data-u="${q.user_id}" data-p="${q.plan}">✓ وصل المبلغ، فعّل شهر</button><button class="no" data-act="reject" data-r="${q.id}">✕ رفض</button></div></div>`).join("")
      : `<div class="sub">ماكو طلبات جديدة.</div>`;
  } else if (adminTab === "users") {
    body = `<input class="field" id="q" placeholder="ابحث بالإيميل" dir="ltr">` + `<div id="ulist">${users.map(x=>`<div class="row" data-em="${esc((x.email||'').toLowerCase())}"><div class="t"><span class="em">${esc(x.email||'—')}</span><span class="badge ${x.plan}">${PLANS.find(p=>p.id===x.plan)?.name}</span></div>
      <div style="color:var(--muted)">${x.plan!=='free'?'ينتهي '+dateAr(x.plan_until)+' · ':''}استخدم اليوم ${x.used_today} رسالة</div>
      <div class="acts">${PLANS.filter(p=>p.price_iqd>0).map(p=>`<button data-act="approve" data-u="${x.user_id}" data-p="${p.id}">+ شهر ${p.name}</button>`).join("")}${x.plan!=='free'?`<button class="no" data-act="free" data-u="${x.user_id}">إلغاء</button>`:''}</div></div>`).join("")}</div>`;
  } else {
    body = `<label class="sub">طريقة الدفع</label><input class="field" id="s_method" value="${esc(SETTINGS.payment_method||'')}">
      <label class="sub">رقم التحويل (يظهر للمشتركين)</label><input class="field" id="s_number" dir="ltr" value="${esc(SETTINGS.payment_number||'')}">
      <button class="primary" id="saveSet">حفظ</button><div class="msg" id="setMsg"></div>`;
  }
  openModal(`<h3>لوحة التحكم</h3>
    <div class="stats"><div><b>${users.length}</b><span>مستخدم</span></div><div><b>${paying.length}</b><span>مشترك</span></div><div><b>${(income/1000).toLocaleString("ar-IQ")} ألف</b><span>دخل شهري تقريبي</span></div></div>
    <div class="tabs"><button data-tab="requests" class="${adminTab==='requests'?'on':''}">الطلبات (${pend.length})</button><button data-tab="users" class="${adminTab==='users'?'on':''}">المستخدمين</button><button data-tab="settings" class="${adminTab==='settings'?'on':''}">الإعدادات</button></div>${body}`);
  const m = $("modalBody");
  m.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ adminTab=b.dataset.tab; showAdmin(); });
  m.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{
    b.disabled = true;
    if (b.dataset.act==="approve") await sb.rpc("admin_set_plan",{p_user:b.dataset.u,p_plan:b.dataset.p,p_days:30});
    if (b.dataset.act==="free") await sb.rpc("admin_set_plan",{p_user:b.dataset.u,p_plan:"free",p_days:0});
    if (b.dataset.act==="reject") await sb.from("payment_requests").update({status:"rejected"}).eq("id",b.dataset.r);
    await loadAccount(); showAdmin();
  });
  const q = $("q"); if (q) q.oninput = () => m.querySelectorAll("#ulist .row").forEach(r=>r.style.display = r.dataset.em.includes(q.value.toLowerCase()) ? "" : "none");
  const sv = $("saveSet"); if (sv) sv.onclick = async () => {
    await sb.from("settings").update({value:$("s_method").value.trim()}).eq("key","payment_method");
    const { error } = await sb.from("settings").update({value:$("s_number").value.trim()}).eq("key","payment_number");
    $("setMsg").textContent = error ? "ما انحفظ" : "✅ انحفظ"; await loadAccount();
  };
}
$("adminBtn").onclick = () => { adminTab = "requests"; showAdmin(); };


/* ===== تحديث تلقائي: إذا انرفعت نسخة جديدة، البرنامج يحدّث نفسه ===== */
async function checkUpdate(){
  if (BUILD.startsWith("__")) return;
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const { v } = await r.json();
    if (v && v !== BUILD && !busy && !$("input").value.trim()) location.replace(location.pathname + "?v=" + v);
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
setInterval(checkUpdate, 5 * 60 * 1000);
checkUpdate();

let wasIn = null;
function render(session){
  const inApp = !!session;
  if (inApp === wasIn) return;   // تجديد الجلسة أو الرجوع للتطبيق ما يصفّر المحادثة
  wasIn = inApp;
  $("auth").style.display = inApp ? "none" : "flex";
  $("app").style.display = inApp ? "flex" : "none";
  if (!inApp) { $("adminBtn").style.display = "none"; $("expiryBar").style.display = "none"; }
  if (inApp) {
    convId = null; curCat = "general";
    let last = null; try { last = JSON.parse(localStorage.getItem("yar_conv") || "null"); } catch {}
    sb.from("categories").select("*").order("sort").then(({data}) => {
      CATS = data || [];
      if (last?.id) openConv(last.id, last.cat); else { setCatLabel(); welcome(); loadConvs(); }
    });
    welcome(); loadAccount();
  }
}
sb.auth.onAuthStateChange((e, s) => { render(s); if (e === "PASSWORD_RECOVERY") setTimeout(showNewPassword, 600); });
const { data: { session } } = await sb.auth.getSession(); render(session);
</script>
</body>
</html>
