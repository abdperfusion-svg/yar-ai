<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YAR AI — يار</title>
<meta name="theme-color" content="#131314">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YAR AI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: هادئ وواثق مثل تطبيقات الذكاء الكبيرة
   IDEA: لوحة كتابة واحدة بالنص، كل شي ثاني يختفي
   PICTURE: نجمة يار المتدرجة + صندوق الكتابة
   COLOUR: أسود دافئ، رمادي ناعم، لمسة متدرجة بنفسجي-وردي لهوية YAR
   TYPE: IBM Plex Sans Arabic، LAYOUT: قائمة جانبية + عمود محادثة ٧٦٠ */
:root{--bg:#131314;--side:#1b1b1d;--panel:#1e1f20;--panel2:#282a2c;--line:#2f3133;--text:#e8e8ea;--muted:#9a9ba0;--dim:#6b6c72;--a1:#60A5FA;--a2:#A78BFA;--a3:#5EEAD4;--ok:#22c55e}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{height:100%}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:16px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
.grad{background:linear-gradient(120deg,var(--a1),var(--a2) 55%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.spark{width:28px;height:28px;flex:none;color:#F4F2EE}
/* ===== الدخول ===== */
#auth{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(600px 400px at 50% 15%,rgba(96,165,250,.10),transparent 70%)}
.card{width:100%;max-width:380px;text-align:center}
.card .spark{width:56px;height:56px;margin:0 auto 14px}
.card h1{font-size:34px;font-weight:700;letter-spacing:-.5px}
.card p.sub{color:var(--muted);margin:6px 0 26px;font-size:15px}
.card input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:14px 16px;font-family:inherit;font-size:16px;margin-bottom:10px;direction:ltr;text-align:right;outline:none}
.card input:focus{border-color:var(--a1)}
.primary{width:100%;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:600;color:#1b1406;background:var(--a1)}
.primary:disabled{opacity:.5}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:600}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px;margin:16px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.link{background:none;border:0;color:var(--muted);font-size:14px;margin-top:12px;width:100%}
.link:hover{color:var(--text)}
.msg{font-size:13.5px;margin-top:10px;min-height:18px;color:var(--a3)}
/* ===== التطبيق ===== */
#app{flex:1;display:none;min-height:0}
aside{width:272px;background:var(--side);display:flex;flex-direction:column;min-height:0;transition:transform .25s}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 6px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.newbtn{display:flex;align-items:center;gap:10px;margin:8px 10px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:0;font-size:14.5px;font-weight:500}
.newbtn:hover{background:#323436}
.search{margin:4px 10px 6px;background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--text);font-family:inherit;font-size:14px;outline:none}
.side-label{color:var(--dim);font-size:12.5px;padding:10px 18px 4px}
#convs{overflow:auto;flex:1;padding:0 8px 8px}
.conv{padding:9px 12px;border-radius:10px;color:var(--muted);font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.active,.conv:hover{background:var(--panel2);color:var(--text)}
.conv{display:flex;align-items:center;gap:4px}.conv .ct{flex:1;overflow:hidden;text-overflow:ellipsis}
.cmore{background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;padding:0 6px;opacity:.55}.conv:hover .cmore,.conv.active .cmore{opacity:1}
.cmenu{position:fixed;z-index:9999;background:var(--panel);border:1px solid var(--line,#333);border-radius:12px;padding:6px;min-width:190px;box-shadow:0 10px 30px #0006;display:flex;flex-direction:column}
.cmenu button{background:none;border:0;color:var(--text);text-align:right;padding:10px 12px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}.cmenu button:hover{background:var(--panel2)}
.ftgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:12px 0}.ftb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:14px;background:var(--panel2);border:1px solid var(--line,#333);color:var(--text);font:inherit;font-size:13.5px;cursor:pointer}.ftb span{font-size:22px}.ftb:hover{border-color:#2f6bff}
.me{border-top:1px solid var(--line);padding:10px;position:relative}
.me-btn{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;padding:8px;border-radius:12px;text-align:right}
.me-btn:hover{background:var(--panel2)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--a1);display:grid;place-items:center;font-weight:700;color:#1b1406;flex:none}
.me-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-plan{font-size:12px;color:var(--muted)}
.menu{position:absolute;bottom:64px;inset-inline:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:6px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:20}
.menu.open{display:block}
.menu button{display:flex;width:100%;gap:10px;align-items:center;background:transparent;border:0;padding:10px 12px;border-radius:10px;font-size:14.5px;text-align:right}
.menu button:hover{background:#36383b}
main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;min-height:56px}
.topbar .title{font-size:17px;font-weight:600;display:flex;gap:8px;align-items:center}
.pill{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--panel2);color:var(--muted);font-weight:500}
.pill.student{background:rgba(94,234,212,.14);color:#5EEAD4}.pill.pro{background:rgba(96,165,250,.14);color:#5EEAD4}.pill.business{background:rgba(245,165,36,.16);color:#fcd38d}
.ibtn{background:transparent;border:0;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;color:var(--muted)}
.ibtn:hover{background:var(--panel2);color:var(--text)}
#menuBtn{display:none}
#expiryBar{background:rgba(245,165,36,.12);color:#fcd38d;text-align:center;font-size:13px;padding:7px 10px}
#chat{flex:1;overflow:auto;padding:8px 16px 24px;scroll-behavior:smooth}
main.empty{justify-content:center}
main.empty #chat{flex:none;overflow:visible;padding-bottom:10px}
main.empty .topbar{position:absolute;top:0;inset-inline:0}
.hello{max-width:760px;margin:0 auto 18px;padding:0 4px}
.hello h2{font-size:clamp(28px,5vw,40px);font-weight:600;letter-spacing:-.5px;line-height:1.2}
.hello p{color:var(--dim);font-size:clamp(22px,4vw,32px);font-weight:500;margin-top:2px}
/* الرسائل */
.msgrow{max-width:760px;margin:0 auto 26px}
.msgrow.user{display:flex;justify-content:flex-start}
.msgrow.user .body{background:var(--panel2);padding:10px 16px;border-radius:20px 20px 6px 20px;max-width:85%;white-space:pre-wrap;line-height:1.75}
.msgrow.ai{display:flex;gap:12px}
.msgrow.ai .spark{margin-top:2px}
.msgrow.ai .col{flex:1}
.msgrow.ai .body{line-height:1.9;font-size:16px}
.body p{margin:0 0 12px}.body p:last-child{margin:0}
.body h1,.body h2,.body h3{margin:18px 0 8px;line-height:1.4}.body h1{font-size:22px}.body h2{font-size:19px}.body h3{font-size:17px}
.body ul,.body ol{margin:6px 0 12px;padding-inline-start:22px}.body li{margin:3px 0}
.body strong{color:#fff}
.body code{background:var(--panel2);padding:1px 6px;border-radius:6px;font-size:14px;direction:ltr;unicode-bidi:embed}
.body pre{background:#0d0d0e;border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;margin:10px 0;direction:ltr;text-align:left}
.body pre code{background:none;padding:0;font-size:13.5px;line-height:1.6}
.body table{border-collapse:collapse;margin:10px 0;display:block;overflow-x:auto;font-size:14.5px}
.body th,.body td{border:1px solid var(--line);padding:7px 11px;text-align:right}.body th{background:var(--panel)}
.body blockquote{border-inline-start:3px solid var(--a1);padding-inline-start:12px;color:var(--muted);margin:8px 0}
.body a{color:#5EEAD4}
.tools{margin-top:8px;display:flex;gap:2px;flex-wrap:wrap}
pre .cpy{position:absolute;top:6px;left:6px;font-size:12px;padding:3px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);opacity:.85}
.tools button{background:transparent;border:0;color:var(--dim);border-radius:8px;font-size:13px;padding:5px 8px}
.tools button:hover{background:var(--panel2);color:var(--text)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px}
.thinking .spark{animation:pulse 1.4s ease-in-out infinite}
.shimmer{background:linear-gradient(90deg,var(--dim) 0%,var(--text) 50%,var(--dim) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35;transform:scale(.9)}}@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.err{color:#fca5a5}
.att{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:12px;padding:5px 10px;font-size:12.5px;color:var(--muted);max-width:200px}
.att span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.att button{background:none;border:0;color:var(--dim);font-size:14px}
.body img{max-width:100%;border-radius:16px;margin:8px 0;display:block;background:var(--panel2);min-height:120px}
.bbtns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}.bbtns button{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;cursor:pointer}
.bbtns .bmain{background:linear-gradient(120deg,var(--a1),var(--a2));border:0;color:#fff;font-weight:700}
.bcode summary{cursor:pointer;color:var(--muted);padding:6px 0}.blink{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0;padding:10px;border:1px dashed var(--a2);border-radius:12px;word-break:break-all}.blink a{color:var(--a3)}.blink button{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit}
.bprev{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.75);display:none;flex-direction:column}.bprev.open{display:flex}
.bbar{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--panel)}.bbar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bbar button{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit}
.bwrap{flex:1;display:flex;justify-content:center;background:#e5e7eb}.bwrap iframe{width:100%;max-width:100%;height:100%;border:0;background:#fff;transition:max-width .25s}
.catchip.on{background:linear-gradient(120deg,rgba(96,165,250,.22),rgba(167,139,250,.22));border-color:var(--a2);color:var(--text)}
/* صندوق الكتابة */
form#composer{padding:0 16px calc(12px + env(safe-area-inset-bottom))}
.box{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:12px 14px 10px;transition:border-color .2s;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.box:focus-within{border-color:#45474b}
textarea{width:100%;background:transparent;border:0;color:var(--text);font-family:inherit;font-size:16px;resize:none;max-height:220px;padding:4px 6px;outline:none;line-height:1.6}
textarea::placeholder{color:var(--dim)}
.box-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:8px}
.catchip{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none;background:transparent;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13.5px;color:var(--muted);position:relative}
.box-row{flex-wrap:wrap;row-gap:6px}
@media(max-width:560px){.hide-sm{display:none}}
.cursor::after{content:"▍";color:var(--a1);animation:pulse 1s infinite;margin-inline-start:2px}
.xmenu{position:relative;display:inline-block}.xmenu .dd{display:none;position:absolute;bottom:110%;inset-inline-start:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:30;min-width:170px;box-shadow:0 8px 30px rgba(0,0,0,.4)}.xmenu.open .dd{display:block}.xmenu .dd button{display:block;width:100%;text-align:start;padding:8px 10px;border-radius:8px}.xmenu .dd button:hover{background:var(--panel)}
.orb{width:120px;height:120px;border-radius:50%;margin:18px auto 0;background:radial-gradient(circle at 35% 30%,#a78bfa,#6d28d9 60%,#3b0764);box-shadow:0 0 0 0 rgba(124,92,255,.5);transition:.3s}
.orb.listen{animation:pulse 1.4s infinite}.orb.think{animation:spin 1.2s linear infinite;background:conic-gradient(#7c5cff,#3b82f6,#7c5cff)}.orb.talk{animation:pulse .7s infinite;background:radial-gradient(circle at 35% 30%,#60a5fa,#2563eb 60%,#1e3a8a)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,92,255,.55)}100%{box-shadow:0 0 0 28px rgba(124,92,255,0)}}@keyframes spin{to{transform:rotate(360deg)}}
#micBtn.rec{background:rgba(239,68,68,.18);border-color:#ef4444;color:#fff}
.skchip{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(120deg,rgba(94,234,212,.14),rgba(167,139,250,.18));border:1px solid rgba(167,139,250,.45);border-radius:20px;padding:4px 6px 4px 12px;font-size:13.5px;margin-bottom:6px}.skchip button{background:transparent;border:0;color:var(--muted);font-size:14px;padding:0 4px}
.sklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:10px 0}
.skcard{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:start;transition:border-color .15s}
.skcard:hover{border-color:var(--a1)}.skcard b{display:block;margin:4px 0 2px}.skcard small{color:var(--muted);display:block;line-height:1.5}
.skcard .ic{font-size:22px}.skcard .mine{float:inline-end;display:flex;gap:4px}.skcard .mine button{font-size:12px;padding:2px 6px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.sktabs{display:flex;gap:6px;margin:8px 0}.sktabs button{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--muted)}.sktabs button.on{background:var(--panel2);color:var(--text);border-color:var(--a1)}
/* خانة الكتابة دائماً تحت + قائمة الخصائص */
main.empty{justify-content:flex-start}
main.empty #chat{flex:1;display:flex;flex-direction:column;justify-content:center;overflow:auto}
#sugg{order:5}form#composer{order:6}
.box-row{flex-wrap:nowrap!important}
.plusWrap{position:relative;flex:none}
.plus{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:24px;line-height:1;display:grid;place-items:center;transition:transform .2s,background .2s}
.plus.open{transform:rotate(45deg);background:var(--panel)}
.plusmenu{position:absolute;bottom:calc(100% + 10px);inset-inline-start:0;width:250px;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:6px;display:none;flex-direction:column;gap:2px;z-index:40;box-shadow:0 16px 50px rgba(0,0,0,.55)}
.plusmenu.open{display:flex}
.plusmenu .catchip{width:100%;justify-content:flex-start;border:0;border-radius:12px;padding:10px 12px;font-size:14.5px;color:var(--text);margin:0!important}
.plusmenu #updBar{position:fixed;top:calc(10px + env(safe-area-inset-top));inset-inline:12px;margin:auto;max-width:520px;z-index:200;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:linear-gradient(120deg,rgba(94,234,212,.16),rgba(96,165,250,.18),rgba(167,139,250,.18)),var(--panel2);border:1px solid rgba(96,165,250,.45);box-shadow:0 12px 40px rgba(0,0,0,.5);animation:ubIn .35s ease}
@keyframes ubIn{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
#updBar .ub-t{flex:1;display:flex;flex-direction:column;min-width:0}#updBar small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#updBar .ub-go{background:var(--a1);color:#0b1020;border:0;border-radius:12px;padding:8px 14px;font-weight:800;flex:none}
#updBar .ub-x{background:transparent;border:0;color:var(--muted);font-size:16px;padding:4px 6px;flex:none}
.catchip:hover{background:var(--panel)}
.plusmenu .catchip.on{background:linear-gradient(120deg,rgba(96,165,250,.20),rgba(167,139,250,.20))}
.plusmenu .catchip.on::after{content:"✓";margin-inline-start:auto;color:var(--a3)}
.pm-sub{margin-inline-start:auto;color:var(--muted);font-size:12px}
.pm-sep{height:1px;background:var(--line);margin:4px 6px}
#activeChips{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
#activeChips::-webkit-scrollbar{display:none}
#activeChips span{flex:none;display:inline-flex;align-items:center;gap:4px;background:rgba(96,165,250,.14);border:1px solid rgba(96,165,250,.35);border-radius:16px;padding:3px 4px 3px 10px;font-size:12.5px;white-space:nowrap}
#activeChips span button{background:transparent;border:0;color:var(--muted);font-size:13px;padding:0 4px}
.catchip:hover{color:var(--text);background:var(--panel2)}
.send{border:0;border-radius:50%;width:40px;height:40px;background:var(--text);color:#111;font-size:18px;display:grid;place-items:center;flex:none}
.send:disabled{background:var(--panel2);color:var(--dim)}
.catmenu{position:absolute;bottom:calc(100% + 8px);inset-inline-start:0;width:290px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:6px;display:none;z-index:30;box-shadow:0 16px 50px rgba(0,0,0,.55);text-align:right}
.catmenu.open{display:block}
.catmenu button{display:flex;gap:12px;width:100%;align-items:flex-start;background:transparent;border:0;padding:10px;border-radius:12px}
.catmenu button:hover,.catmenu button.on{background:#36383b}
.catmenu .ic{font-size:20px;line-height:1.2}
.catmenu b{display:block;font-size:14.5px;font-weight:600;color:var(--text)}
.catmenu small{color:var(--muted);font-size:12.5px}
.meta{max-width:760px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--dim)}
#sugg{width:100%;max-width:760px;margin:14px auto 0;align-self:center;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 16px}
#sugg button{background:transparent;border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:13.5px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sugg button:hover{background:var(--panel2);color:var(--text)}
main:not(.empty) #sugg{display:none}
footer.credit{text-align:center;font-size:11.5px;color:var(--dim);padding:2px 0 8px}
.scrim{display:none}
@media (max-width:800px){
  aside{position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:40;transform:translateX(100%);width:84%;max-width:310px;box-shadow:0 0 60px rgba(0,0,0,.6)}
  aside.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
  #menuBtn{display:grid}
  .catmenu{width:min(290px,80vw)}
}
/* ===== النوافذ (الباقات، الذاكرة، لوحة التحكم) ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.show{display:flex}
.modal{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:24px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.overlay{align-items:center}.modal{border-radius:24px}}
.modal h3{font-size:21px;margin-bottom:4px;font-weight:600}.modal .sub{color:var(--muted);font-size:13.5px;margin-bottom:14px;line-height:1.7}
.x{position:absolute;top:14px;left:14px;background:var(--panel2);border:0;width:34px;height:34px;border-radius:50%}
.icon-btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.plan{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--bg);cursor:pointer}
.plan.sel{border-color:var(--a1);box-shadow:0 0 0 2px rgba(96,165,250,.3)}
.plan.cur{opacity:.8}
.plan .p{font-size:22px;font-weight:700}.plan .p small{font-size:12px;color:var(--muted);font-weight:500}
.plan ul{list-style:none;font-size:13px;color:var(--muted);margin-top:6px;line-height:1.9}
.pay{background:var(--bg);border:1px dashed var(--a3);border-radius:14px;padding:12px;font-size:14px;line-height:1.9;margin-bottom:10px}
.pay b{color:var(--a3);direction:ltr;unicode-bidi:embed}
.field{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px;font-family:inherit;font-size:16px;margin-bottom:8px;outline:none}
.field:focus{border-color:var(--a1)}
.tabs{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.tabs button{background:var(--bg);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 14px;font-size:13px}
.tabs button.on{color:var(--text);border-color:var(--a1)}
.row{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;background:var(--bg)}
.row .t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.row .em{direction:ltr;font-weight:600;word-break:break-all}
.row .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.row .acts button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:5px 10px;font-size:12.5px}
.row .acts button.ok{background:#166534;border-color:#166534}.row .acts button.no{background:#7f1d1d;border-color:#7f1d1d}
.badge{font-size:11.5px;padding:2px 9px;border-radius:20px;background:var(--panel2);color:var(--muted)}
.badge.student{background:rgba(94,234,212,.16);color:#5EEAD4}.badge.pro{background:rgba(96,165,250,.16);color:#5EEAD4}.badge.business{background:rgba(245,165,36,.18);color:#fcd38d}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:22px}.stats span{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#printBox{display:none}
@media print{
  body.printing{background:#fff!important;color:#111;overflow:visible;display:block}
  body.printing > *:not(#printBox){display:none!important}
  body.printing #printBox{display:block}
  @page{size:A4;margin:16mm 14mm}
  .pdf{font-family:'IBM Plex Sans Arabic',sans-serif;color:#1a1a1a;font-size:12.5pt;line-height:1.9;direction:rtl}
  .pdf h1{font-size:20pt;color:#5b21b6;margin:0 0 10px}
  .pdf h2{font-size:15pt;color:#6d28d9;margin:18px 0 6px;border-bottom:1px solid #e9e3fb;padding-bottom:3px;break-after:avoid}
  .pdf h3{font-size:13pt;margin:12px 0 4px;break-after:avoid}
  .pdf p{margin:0 0 8px}.pdf ul,.pdf ol{margin:4px 0 10px;padding-right:22px}
  .pdf table{border-collapse:collapse;width:100%;margin:8px 0}.pdf th,.pdf td{border:1px solid #bbb;padding:5px 8px;text-align:right}.pdf th{background:#f3effe}
  .pdf pre{direction:ltr;text-align:left;background:#f5f5f5;padding:8px;border-radius:6px;white-space:pre-wrap;font-size:10pt}
  .pdf strong{color:#000}.pdf li,.pdf tr{break-inside:avoid}
  .pdf .foot{margin-top:20px;border-top:1px solid #ddd;padding-top:6px;font-size:9pt;color:#888;text-align:center}
}

/* ===== البنّاء: تشغيل ونشر المواقع والبرامج اللي يسويها يار ===== */
function htmlOf(text){
  const m = String(text).match(/```html\s*([\s\S]*?)```/i);
  const h = (m ? m[1] : "").trim();
  return /<(html|body|div|script|style)[\s>]/i.test(h) ? h : "";
}
function storeShim(key){
  let data = {}; try { data = JSON.parse(localStorage.getItem(key) || "{}"); } catch {}
  return `<script>(function(){var d=${JSON.stringify(data).replace(/</g,"\\u003c")};function p(m){try{parent.postMessage(Object.assign({yarStore:1},m),"*")}catch(e){}}
var s={getItem:function(k){k=String(k);return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[String(k)]=String(v);p({k:String(k),v:String(v)})},removeItem:function(k){delete d[String(k)];p({k:String(k),del:1})},clear:function(){d={};p({clear:1})},key:function(i){return Object.keys(d)[i]||null},get length(){return Object.keys(d).length}};
try{Object.defineProperty(window,"localStorage",{value:s,configurable:true})}catch(e){}try{Object.defineProperty(window,"sessionStorage",{value:s,configurable:true})}catch(e){}})();<\/script>`;
}
function withShim(html, key){
  const sh = storeShim(key);
  return /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + sh) : sh + html;
}
let PREV_FRAME = null, PREV_KEY = "";
window.addEventListener("message", e => {
  if (!PREV_FRAME || e.source !== PREV_FRAME.contentWindow || !e.data?.yarStore) return;
  let d = {}; try { d = JSON.parse(localStorage.getItem(PREV_KEY) || "{}"); } catch {}
  if (e.data.clear) d = {}; else if (e.data.del) delete d[e.data.k]; else d[e.data.k] = e.data.v;
  const j = JSON.stringify(d); if (j.length < 3_000_000) try { localStorage.setItem(PREV_KEY, j); } catch {}
});

function addBuilder(d, text){

  };

    if (error) { pb.disabled = false; pb.textContent = "🌐 انشره برابط"; alert(error.message.includes("٥٠") ? error.message : "ما انشر، جرّب مرة ثانية"); return; }

}

document.addEventListener("click", () => document.querySelectorAll(".xmenu.open").forEach(x=>x.classList.remove("open")));
const plain = s => String(s).replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\*\*(.+?)\*\*/g,"$1").replace(/__(.+?)__/g,"$1").replace(/`([^`]+)`/g,"$1").replace(/\[([^\]]+)\]\(([^)]+)\)/g,"$1 ($2)").replace(/<[^>]+>/g,"");
const titleOf = t => (t.match(/^#\s+(.+)$/m)?.[1] || t.split("\n").find(l=>l.trim()) || "YAR AI").replace(/[#*`]/g,"").trim().slice(0,60);

function mdBlocks(md){ // يحوّل Markdown لكتل: عنوان، نقطة، جدول، فقرة
  const out = [], lines = String(md).replace(/\r/g,"").split("\n");
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*\|.*\|\s*$/.test(l)) { const rows = []; while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { if (!/^\s*\|?\s*:?-{2,}/.test(lines[i])) rows.push(lines[i].trim().replace(/^\||\|$/g,"").split("|").map(c=>plain(c.trim()))); i++; } i--; out.push({ t:"table", rows }); continue; }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.+)/))) out.push({ t:"h", level:m[1].length, text:plain(m[2]) });
    else if ((m = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.+)/))) out.push({ t:"li", text:plain(m[1]) });
    else if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) continue;

// نعرف لغة النص من حروفه: كردي (سوراني)، عربي، أو إنكليزي
function textLang(t){
  t = String(t||"");
  const ar = (t.match(/[\u0600-\u06FF]/g)||[]).length, la = (t.match(/[A-Za-z]/g)||[]).length;
  if (/[ڕڵێۆەھڤ]/.test(t)) return "ckb";
  if (ar >= la && ar) return "ar";
  return la ? "en" : "ar";
}
const LANG_TAGS = { ar:["ar-IQ","ar-SA","ar"], ckb:["ckb-IQ","ku","ckb","ar-IQ","ar"], en:["en-US","en-GB","en"] };
function getVoicesReady(){
  return new Promise(res => {
    const v = speechSynthesis.getVoices(); if (v.length) return res(v);
    const done = () => res(speechSynthesis.getVoices());
    speechSynthesis.addEventListener("voiceschanged", done, { once:true }); setTimeout(done, 1500);
  });
}
async function speak(text, btn){
  if (!("speechSynthesis" in window)) return alertBox("جهازك ما يدعم القراءة الصوتية");
  if (speechSynthesis.speaking) { speechSynthesis.cancel(); btn.textContent = "🔊"; return; }
  const clean = plain(text).replace(/https?:\/\/\S+/g,"").slice(0, 4000);
  const lg = textLang(clean), vs = await getVoicesReady();
  let v = null;
  for (const tag of LANG_TAGS[lg]) { v = vs.find(x => x.lang.toLowerCase().replace("_","-").startsWith(tag.toLowerCase())); if (v) break; }
  if (!v && lg !== "en") return alertBox(lg === "ckb"
    ? "جهازك ما بيه صوت كردي للقراءة. من إعدادات الجهاز ← اللغة ← تحويل النص إلى كلام، نزّل صوت كردي أو عربي."
    : "جهازك ما بيه صوت عربي للقراءة. من إعدادات الجهاز ← اللغة ← تحويل النص إلى كلام (Text-to-speech)، نزّل اللغة العربية وارجع جرّب.");

async function fileToText(f){
  const n = f.name.toLowerCase();
  if (n.endsWith(".pdf")) {
    const pdfjs = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs");
    pdfjs.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs";
    const doc = await pdfjs.getDocument({ data: await f.arrayBuffer() }).promise;
    let out = "";
    for (let i = 1; i <= Math.min(doc.numPages, 300); i++) { const pg = await doc.getPage(i); const tc = await pg.getTextContent(); out += tc.items.map(x => x.str).join(" ") + "\n\n"; }
    return out;
  }
  if (n.endsWith(".docx")) {
    if (!window.mammoth) await new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
    return (await window.mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() })).value;
  }
  if (/\.(xlsx|xls)$/.test(n)) {
    const X = await import("https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs");
    const wb = X.read(await f.arrayBuffer());
    return wb.SheetNames.map(sh => `### ورقة: ${sh}\n` + X.utils.sheet_to_csv(wb.Sheets[sh])).join("\n\n");
  }
  if (n.endsWith(".pptx")) {
    const { default: JSZip } = await import("https://esm.sh/jszip@3.10.1");
    const z = await JSZip.loadAsync(await f.arrayBuffer());
    const sl = Object.keys(z.files).filter(k => /^ppt\/slides\/slide\d+\.xml$/.test(k)).sort((a,b) => +a.match(/\d+/)[0] - +b.match(/\d+/)[0]);
    let out = ""; for (const [i,k] of sl.entries()) { const x = await z.file(k).async("string"); out += `### شريحة ${i+1}\n` + [...x.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m => m[1]).join(" ") + "\n\n"; }
    return out;
  }
  return await f.text();
}
function chunkText(t){
  const clean = t.replace(/\r/g, "").replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
  const out = []; let i = 0;
  while (i < clean.length && out.length < 600) { let end = Math.min(clean.length, i + 1200); const cut = clean.lastIndexOf("\n", end); if (cut > i + 600) end = cut; out.push(clean.slice(i, end).trim()); i = end - 120 > i ? end - 120 : end; }
  return out.filter(x => x.length > 30);
}

async function runFileTool(k, files){

        for (const it of tc.items) { const y = Math.round(it.transform?.[5] ?? 0); if (lastY !== null && Math.abs(y - lastY) > 3) { paras.push(line.trim()); line = ""; } line += it.str + (it.hasEOL ? "\n" : " "); lastY = y; }

      save(await d.Packer.toBlob(new d.Document({ creator: "YAR AI", sections: [{ children: kids }] })), baseName(f) + ".docx");
      return say("✅ تحوّل لملف Word. ملاحظة: ينقل الكلام والترتيب، والتصميم المعقد ممكن يتغيّر شوية.");
    }

        const jpg = await doc.embedJpg(await (await fetch(c.toDataURL("image/jpeg", 0.9))).arrayBuffer());

      catch (e) { return say(e?.name === "PasswordException" ? "⚠️ الرمز غلط، أو الملف مقفول. استخدم «فك قفل PDF» واكتب الرمز الصحيح." : "⚠️ ما كدرت أفتح الملف"); }
      const P = k === "unlock" ? await pdfLib() : null, outDoc = P ? await P.PDFDocument.create() : null, n = Math.min(doc.numPages, 60);
      for (let i = 1; i <= n; i++) {

        const pg = await doc.getPage(i), vp = pg.getViewport({ scale: 2 }), c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
        await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
        if (outDoc) { const jpg = await outDoc.embedJpg(await (await fetch(c.toDataURL("image/jpeg", 0.9))).arrayBuffer()); const p2 = outDoc.addPage([vp.width / 2, vp.height / 2]); p2.drawImage(jpg, { x: 0, y: 0, width: vp.width / 2, height: vp.height / 2 }); }

    }

    if (k === "any2text") {
      const t = (await fileToText(f)).trim();
      if (!t) return say("⚠️ ما بيه نص مكتوب (يمكن صور ممسوحة). ارفعه ليار بالمحادثة ويقراه.");

}

function shrinkImage(f, max){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res({ mime: "image/jpeg", data: c.toDataURL("image/jpeg", 0.88).split(",")[1], w: c.width, h: c.height });
    };
    img.onerror = () => res({ mime: f.mime, data: f.data });
    img.src = `data:${f.mime};base64,${f.data}`;
  });
}
async function send(){
  const text = $("input").value.trim();

  let ref = null;
  if (imgMode && ATT.length) {
    const im = ATT.find(f => f.mime.startsWith("image/"));
    if (!im) { alertBox("بوضع الصور ارفع صورة بس (مو ملف)"); return; }
    if (!text) { alertBox("اكتب شنو تريد تغيّر بالصورة، مثلاً: حوّلها لستايل كرتون"); return; }
    ref = await shrinkImage(im, 1024);
  }
  const files = imgMode ? [] : ATT.slice();
  try { localStorage.removeItem("yar_draft"); sessionStorage.removeItem("yar_att"); } catch {}
  if ((!text && !files.length) || busy) return;
  ATT = []; renderAtt();
  busy = true; $("sendBtn").disabled = true; $("input").value = ""; autosize();
  bubble("user", files.length ? `📎 ${files.map(f=>f.name).join("، ")}\n${text}` : (ref ? `🖼️ ${text}` : text));
  const pending = bubble("ai", null); if (imgMode) pending.querySelector(".shimmer").textContent = ref ? "يار يعدّل صورتك… (تاخذ ثواني)" : "يار يرسم الصورة… (تاخذ ثواني)";
  const body = pending.querySelector(".body");
  const showErr = (err, upgrade) => {
    body.innerHTML = `<span class="err">⚠️ ${esc(err)}</span>` + (upgrade ? `<br><button class="primary" style="margin-top:10px;width:auto;padding:8px 18px">⭐ شوف الباقات</button>` : "");
    const ub = body.querySelector("button"); if (ub) ub.onclick = () => showPlans();
  };
  const done = (data) => {
    body.classList.remove("cursor");
    body.innerHTML = fmt(data.reply); addCopy(pending, data.reply);
    const isNew = !convId; convId = data.conversation_id; saveConv();
    if (typeof data.remaining === "number") $("remain").textContent = data.remaining > 9999 ? "محادثة بلا حدود ·" : `باقي اليوم ${data.remaining} رسالة ·`;
    if (typeof data.points === "number") showPoints(data.points);
    if (typeof data.remaining_images === "number") $("remain").textContent = `باقي اليوم ${data.remaining_images} صور ·`;
    if (isNew) loadConvs();
  };
  try {
    if (imgMode) {
      const { data, error } = await sb.functions.invoke("image", { body: { conversation_id: convId, message: text, category: curCat, ref } });
      if (error) { try { const j = await error.context.json(); showErr(j.error, !!j.upgrade); } catch { showErr("صار خلل بالاتصال، جرّب مرة ثانية"); } }
      else {
        done(data);
        if (data?.overlay && (data.overlay.text || data.overlay.kind) && data.image) {
          const im = body.querySelector("img");
          if (im) im.style.opacity = ".5";
          pending.querySelector(".body").insertAdjacentHTML("beforeend", `<div class="sub" id="ovl">✍️ يار يكتب الكلام على الصورة…</div>`);
          try {
            const o = data.overlay;
            const png = o.kind === "poster" ? await drawPoster(data.image, o) : o.kind === "identity" ? await drawIdentity(data.image, o) : await addArabicText(data.image, o.text, o.pos);
            const r = await sb.functions.invoke("image", { body: { action: "overlay", conversation_id: data.conversation_id, old_url: data.image, png } });
            if (r.data?.image) data._final = r.data.image;
            if (r.data?.image && im) { im.src = r.data.image; const a = im.closest("a"); if (a) a.href = r.data.image; }
          } catch (e) { console.error("overlay", e); }
          if (im) im.style.opacity = ""; document.getElementById("ovl")?.remove();
        }
        if (data?.image && data.overlay?.kind !== "identity") addProVideoBtn(pending, data.image);
        if (data?.image && data.overlay?.kind !== "identity") addVideoBtn(pending, data.overlay?.kind === "poster" ? data.image : (data._final || data.image), data.overlay?.kind === "poster" ? data.overlay : null);
      }
      return;
    }
    const sh = pending.querySelector(".shimmer");
    if (RESEARCH) sh.textContent = "🔎 يبدي البحث العميق… (ياخذ دقيقة تقريباً)"; else if (THINK) sh.textContent = "يار يفكر بعمق…";
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch(`${SUPABASE_URL}/functions/v1/${RESEARCH ? "research" : "chat"}`, { method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY, Authorization: `Bearer ${session?.access_token}` },
      body: JSON.stringify({ conversation_id: convId, message: text, category: curCat, files, mode: MODE, think: THINK, build: BUILDM, stream: true, skill_id: SKILL?.id || null }) });
    if (!res.ok || !(res.headers.get("content-type") || "").includes("event-stream")) {
      let j = {}; try { j = await res.json(); } catch {}
      showErr(j.error || "صار خلل بالاتصال، جرّب مرة ثانية", !!j.upgrade); return;
    }
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "", acc = "", raf = 0, finished = false;
    const paint = () => { raf = 0; body.innerHTML = fmt(acc); const c = $("chat"); if (c.scrollHeight - c.scrollTop - c.clientHeight < 160) c.scrollTop = c.scrollHeight; };
    while (true) {
      const { value, done: end } = await reader.read();
      if (end) break;
      buf += value; let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith("data:")) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.conversation_id && !ev.done && !convId) { convId = ev.conversation_id; saveConv(); }
        if (ev.status && !acc) { const x = body.querySelector(".shimmer"); if (x) x.textContent = ev.status; }

        if (ev.done) { if (raf) cancelAnimationFrame(raf); done(ev); finished = true; loadConvs(); }
      }
    }
    if (!finished) { body.classList.remove("cursor"); if (acc) { body.innerHTML = fmt(acc); addCopy(pending, acc); } else showErr("انقطع الاتصال، جرّب مرة ثانية"); }
  } finally { busy = false; $("sendBtn").disabled = false; $("chat").scrollTop = $("chat").scrollHeight; }
}

// الذكاء الاصطناعي ما يعرف يكتب عربي، فيار يكتب الكلام بخط القاهرة فوگ الصورة
async function addArabicText(url, text, pos){
  try { await document.fonts.load('900 80px Cairo'); } catch {}
  const img = await new Promise((ok, no) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => ok(i); i.onerror = no; i.src = url + (url.includes("?") ? "&" : "?") + "cors=1"; });
  const W = img.naturalWidth, H = img.naturalHeight;
  const logo = pos === "logo";
  const extra = logo ? Math.round(H * 0.24) : 0;
  const c = document.createElement("canvas"); c.width = W; c.height = H + extra;
  const x = c.getContext("2d");
  if (logo) {
    // لون الخلفية من زاوية الصورة حتى يبين كأنه جزء منها
    x.drawImage(img, 0, 0, 1, 1, 0, 0, 1, 1);
    const [r, g, b] = x.getImageData(0, 0, 1, 1).data;
    x.fillStyle = `rgb(${r},${g},${b})`; x.fillRect(0, 0, W, H + extra);
    x.drawImage(img, 0, 0);
    const light = (r * 299 + g * 587 + b * 114) / 1000 > 140;
    x.fillStyle = light ? "#14213d" : "#ffffff";
    fitText(x, text, W * 0.86, extra * 0.62);
    x.textAlign = "center"; x.textBaseline = "middle"; x.direction = "rtl";
    x.fillText(text, W / 2, H + extra * 0.45);
  } else {
    x.drawImage(img, 0, 0);
    const size = fitText(x, text, W * 0.82, H * 0.09);
    const tw = Math.min(W * 0.9, x.measureText(text).width + size * 1.4), th = size * 1.75;
    const cy = pos === "top" ? H * 0.1 : H * 0.88;
    x.fillStyle = "rgba(10,12,20,.72)";
    const rx = (W - tw) / 2, ry = cy - th / 2, rad = th / 2;
    x.beginPath(); x.roundRect ? x.roundRect(rx, ry, tw, th, rad) : x.rect(rx, ry, tw, th); x.fill();
    x.fillStyle = "#ffffff"; x.textAlign = "center"; x.textBaseline = "middle"; x.direction = "rtl";
    x.fillText(text, W / 2, cy + size * 0.06);
  }
  return c.toDataURL("image/png").split(",")[1];
}
function loadImg(url){
  return new Promise((ok, no) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => ok(i); i.onerror = no; i.src = url + (url.includes("?") ? "&" : "?") + "cors=1"; });
}
function pill(x, cx, cy, text, size, bg, fg){
  x.font = `800 ${size}px Cairo, sans-serif`;
  const w = x.measureText(text).width + size * 1.3, h = size * 1.7;
  x.fillStyle = bg; x.beginPath(); x.roundRect ? x.roundRect(cx - w / 2, cy - h / 2, w, h, h / 2) : x.rect(cx - w / 2, cy - h / 2, w, h); x.fill();
  x.fillStyle = fg; x.textAlign = "center"; x.textBaseline = "middle"; x.direction = "rtl"; x.fillText(text, cx, cy + size * 0.05);
  return w;
}
// يقسّم العنوان لسطرين إذا طويل
function lines2(x, text, maxW){
  if (x.measureText(text).width <= maxW) return [text];
  const w = text.split(/\s+/); let best = [text];
  for (let i = 1; i < w.length; i++) { const a = w.slice(0, i).join(" "), b = w.slice(i).join(" "); if (x.measureText(a).width <= maxW && x.measureText(b).width <= maxW) { best = [a, b]; break; } }
  return best;
}

async function makeVideo(url, d, onProgress){
  try { await document.fonts.load('900 80px Cairo'); } catch {}
  const img = await loadImg(url);
  let W = img.naturalWidth, H = img.naturalHeight; const k = Math.min(1, 1080 / Math.max(W, H) * 1.0); W = Math.round(W * k / 2) * 2; H = Math.round(H * k / 2) * 2;

  const types = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
  const mime = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));

  draw(0);
  const done = new Promise(r => rec.onstop = r);
  rec.start(250);
  const t0 = performance.now();
  await new Promise(res => { const step = () => { const T = (performance.now() - t0) / 1000; draw(Math.min(T, DUR)); onProgress?.(Math.min(1, T / DUR)); if (T < DUR + .3) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); });

}

      if (error) { $("connMsg").textContent = "صار خلل، جرّب مرة ثانية"; return; }
      const { data: me } = await sb.functions.invoke("telegram?me=1", { method: "GET" }).catch(()=>({data:null}));
      const link = me?.username ? `https://t.me/${me.username}?start=link_${code}` : "";
      $("connMsg").innerHTML = `افتح بوت يار بتلكرام ودز هذا الكود:<br><b style="font-size:22px;letter-spacing:3px">${code}</b><br>${link ? `<a class="primary" style="display:inline-block;margin-top:8px;padding:8px 18px;text-decoration:none" href="${link}" target="_blank">✈️ افتح تلكرام واربط</a>` : ""}<br><small>الكود يشتغل ١٥ دقيقة. بعد ما تربط سكّر وافتح هالصفحة.</small>`;
      return;
    }
    const { data: r, error } = await sb.functions.invoke(["magnific","higgsfield"].includes(pv) ? "mcp-link" : "connect", { body: { provider: pv, action: "start" } });
    if (error || !r?.url) { let m = "صار خلل، جرّب مرة ثانية"; try { m = (await error.context.json()).error || m; } catch {} $("connMsg").textContent = m; b.disabled = false; return; }
    location.href = r.url;
  });
}
$("connBtn").onclick = showConnections;
// رجوع من صفحة الربط
(() => {
  const q = new URLSearchParams(location.search);
  const ok = q.get("connected"), bad = q.get("connect_error");
  if (!ok && !bad) return;
  history.replaceState(null, "", location.pathname);
  setTimeout(() => {
    if (ok) alertBox(`✅ انربط ${CONNECTORS.find(c=>c.id===ok)?.name || ok} بنجاح. هسه گول ليار شنو يسوي بيه.`);
    else alertBox(bad === "cancel" ? "لغيت الربط." : "ما تم الربط، جرّب مرة ثانية.");
  }, 1200);
})();

/* ===== الملف الشخصي (يطلع أول مرة يسجّل) ===== */
const PF = [
  ["full_name","اسمك","مثلاً: عبدالرحمن طاهر"],
  ["specialty","تخصصك أو شغلك","مثلاً: هندسة مدني / تمريض / مبرمج ويب"],
  ["institution","جامعتك أو مكان شغلك","مثلاً: جامعة بغداد / شركة…"],
  ["stage","المرحلة أو سنين الخبرة","مثلاً: مرحلة رابعة / ماجستير / ٥ سنين خبرة"],
  ["city","مدينتك","مثلاً: بغداد"],
  ["about","شي تحب يار يعرفه عنك (اختياري)","مثلاً: أشتغل على بحث تخرج عن الطاقة الشمسية، وأحب الأجوبة مختصرة"],
];
function showProfile(first){
  openModal(`<h3>${first ? "أهلاً بيك بـ YAR AI 👋" : "👤 ملفي"}</h3>
    <div class="sub">${first ? "عرّفنا بنفسك حتى يار يشتغل وياك على مستواك ويتذكرك بكل محادثة." : "يار يستخدم هذي المعلومات بكل محادثاتك."}</div>
    <label class="sub">مجالك الأساسي</label>
    <select class="field" id="pf_category">${CATS.map(c=>`<option value="${c.id}" ${c.id===(PROF.category||curCat)?'selected':''}>${c.icon} ${c.name}</option>`).join("")}</select>
    ${PF.map(([k,l,ph])=>`<label class="sub">${l}</label>${k==='about'?`<textarea class="field" id="pf_${k}" rows="3" placeholder="${ph}">${esc(PROF[k]||'')}</textarea>`:`<input class="field" id="pf_${k}" placeholder="${ph}" value="${esc(PROF[k]||'')}">`}`).join("")}
    <button class="primary" id="saveProf">حفظ</button>${first?'<button class="link" id="skipProf">بعدين</button>':''}<div class="msg" id="profMsg"></div>`);
  $("saveProf").onclick = async () => {
    const row = { onboarded: true, category: $("pf_category").value };
    PF.forEach(([k]) => row[k] = ($("pf_"+k).value || "").trim().slice(0, 400) || null);
    if (!row.full_name || !row.specialty) { $("profMsg").textContent = "اكتب اسمك وتخصصك على الأقل"; return; }
    const uid = (await sb.auth.getUser()).data.user.id;
    const { error } = await sb.from("profiles").update(row).eq("user_id", uid);
    if (error) { $("profMsg").textContent = "ما انحفظ، جرّب مرة ثانية"; return; }
    PROF = { ...PROF, ...row }; curCat = row.category; setCatLabel(); closeModal(); if (!convId) welcome(); loadAccount();
  };
  const sk = $("skipProf"); if (sk) sk.onclick = closeModal;
}

/* ===== لوحة التحكم ===== */
let adminTab = "requests";
async function showAdmin(){
  const [u, r] = await Promise.all([
    sb.rpc("admin_users"),
    sb.from("payment_requests").select("id,user_id,plan,sender,note,status,created_at").order("created_at",{ascending:false}).limit(200),
  ]);
  const users = u.data || [], reqs = r.data || [];
  const byId = Object.fromEntries(users.map(x=>[x.user_id,x]));
  const pend = reqs.filter(x=>x.status==="pending");
  const paying = users.filter(x=>x.plan!=="free");
  const income = paying.reduce((s,x)=>s+(PLANS.find(p=>p.id===x.plan)?.price_iqd||0),0);
  let body = "";
  if (adminTab === "requests") {
    body = pend.length ? pend.map(q=>`<div class="row"><div class="t"><span class="em">${esc(byId[q.user_id]?.email||'—')}</span><span class="badge ${q.plan}">${isPack(q.plan) ? '💰 '+(PACKS.find(k=>k.id===q.plan)?.points||'')+' نقطة' : PLANS.find(p=>p.id===q.plan)?.name}</span></div>
      <div>رقم الوصل: <b dir="ltr">${esc(q.sender)}</b> · ${dateAr(q.created_at)}</div>${q.note?`<div style="color:var(--muted)">${esc(q.note)}</div>`:''}
      <div class="acts">${isPack(q.plan) ? `<button class="ok" data-act="points" data-u="${q.user_id}" data-p="${q.plan}">✓ وصل المبلغ، ضيف النقاط</button>` : `<button class="ok" data-act="approve" data-u="${q.user_id}" data-p="${q.plan}">✓ وصل المبلغ، فعّل شهر</button>`}<button class="no" data-act="reject" data-r="${q.id}">✕ رفض</button></div></div>`).join("")
      : `<div class="sub">ماكو طلبات جديدة.</div>`;
  } else if (adminTab === "users") {
    body = `<input class="field" id="q" placeholder="ابحث بالإيميل" dir="ltr">` + `<div id="ulist">${users.map(x=>`<div class="row" data-em="${esc((x.email||'').toLowerCase())}"><div class="t"><span class="em">${esc(x.email||'—')}</span><span class="badge ${x.plan}">${PLANS.find(p=>p.id===x.plan)?.name}</span></div>
      <div style="color:var(--muted)">${x.plan!=='free'?'ينتهي '+dateAr(x.plan_until)+' · ':''}استخدم اليوم ${x.used_today} رسالة</div>
      <div class="acts">${PLANS.filter(p=>p.price_iqd>0).map(p=>`<button data-act="approve" data-u="${x.user_id}" data-p="${p.id}">+ شهر ${p.name}</button>`).join("")}${x.plan!=='free'?`<button class="no" data-act="free" data-u="${x.user_id}">إلغاء</button>`:''}</div></div>`).join("")}</div>`;
  } else if (adminTab === "quality") {
    const [f, er] = await Promise.all([
      sb.from("feedback").select("rating,question,reply,note,created_at").order("created_at",{ascending:false}).limit(60),
      sb.from("client_errors").select("message,where_,created_at").order("created_at",{ascending:false}).limit(30),
    ]);
    const fs = f.data || [], ups = fs.filter(x=>x.rating>0).length, dns = fs.length - ups;
    body = `<div class="stats"><div><b>${ups}</b><span>👍 زين</span></div><div><b>${dns}</b><span>👎 مو زين</span></div><div><b>${fs.length ? Math.round(ups*100/fs.length) : 0}٪</b><span>رضا</span></div></div>
      <div class="sub" style="font-weight:700">آخر الأجوبة اللي ما عجبت:</div>
      ${fs.filter(x=>x.rating<0).slice(0,20).map(x=>`<div class="row"><div><b>السؤال:</b> ${esc((x.question||'—').slice(0,200))}</div><div style="color:var(--muted)"><b>الجواب:</b> ${esc((x.reply||'').slice(0,250))}…</div>${x.note?`<div>📝 ${esc(x.note)}</div>`:''}<div style="color:var(--muted)">${dateAr(x.created_at)}</div></div>`).join("") || '<div class="sub">لهسه ماكو.</div>'}
      <div class="sub" style="font-weight:700;margin-top:12px">آخر أخطاء التطبيق:</div>
      ${(er.data||[]).map(x=>`<div class="row" dir="ltr" style="font-size:12px">${esc(x.message||'')} <span style="color:var(--muted)">${esc(x.where_||'')}</span></div>`).join("") || '<div class="sub">ماكو أخطاء 👌</div>'}`;
  } else if (adminTab === "profit") {
    const { data: st } = await sb.rpc("admin_usage_30d");
    const cm = +SETTINGS.cost_per_msg_iqd || 5, ci = +SETTINGS.cost_per_img_iqd || 0;
    const rows = (st||[]).map(x=>({ ...x, cost: Math.round(x.msgs*cm + x.images*ci), rev: x.plan!=="free" ? x.price_iqd : 0 })).map(x=>({ ...x, net: x.rev - x.cost }));
    const T = rows.reduce((a,x)=>({ rev:a.rev+x.rev, cost:a.cost+x.cost, msgs:a.msgs+Number(x.msgs) }),{ rev:0, cost:0, msgs:0 });
    body = `<div class="stats"><div><b>${iqd(T.rev)}</b><span>دخل آخر ٣٠ يوم</span></div><div><b>${iqd(T.cost)}</b><span>كلفة الذكاء التقريبية</span></div><div><b style="color:${T.rev-T.cost>=0?'#22c55e':'#ef4444'}">${iqd(T.rev-T.cost)}</b><span>الربح الصافي</span></div></div>
      <div class="sub">الكلفة تقديرية: ${cm} دينار لكل رسالة و${ci} لكل صورة (تعدّلها من الإعدادات). ${T.msgs} رسالة بآخر ٣٠ يوم.</div>
      ${rows.filter(x=>x.msgs>0||x.rev>0).map(x=>`<div class="row"><div class="t"><span class="em">${esc(x.full_name||x.email||'—')}</span><span class="badge ${x.plan}">${PLANS.find(p=>p.id===x.plan)?.name||x.plan}</span></div>
        <div style="color:var(--muted)">${x.msgs} رسالة · ${x.images} صورة · نشط ${x.active_days} يوم</div>
        <div>دفع ${iqd(x.rev)} · كلّف ${iqd(x.cost)} · <b style="color:${x.net>=0?'#22c55e':'#ef4444'}">${x.net>=0?'ربح':'خسارة'} ${iqd(Math.abs(x.net))}</b></div></div>`).join("") || '<div class="sub">لهسه ماكو استخدام.</div>'}`;
  } else {
    body = `<label class="sub">طريقة الدفع</label><input class="field" id="s_method" value="${esc(SETTINGS.payment_method||'')}">
      <label class="sub">رقم التحويل (يظهر للمشتركين)</label><input class="field" id="s_number" dir="ltr" value="${esc(SETTINGS.payment_number||'')}">
      <label class="sub">كلفة الرسالة التقريبية (دينار) — لحساب الأرباح</label><input class="field" id="s_cm" inputmode="numeric" dir="ltr" value="${esc(SETTINGS.cost_per_msg_iqd||'5')}">
      <label class="sub">كلفة الصورة التقريبية (دينار)</label><input class="field" id="s_ci" inputmode="numeric" dir="ltr" value="${esc(SETTINGS.cost_per_img_iqd||'0')}">
      <button class="primary" id="saveSet">حفظ</button><div class="msg" id="setMsg"></div>`;
  }
  openModal(`<h3>لوحة التحكم</h3>
    <div class="stats"><div><b>${users.length}</b><span>مستخدم</span></div><div><b>${paying.length}</b><span>مشترك</span></div><div><b>${(income/1000).toLocaleString("ar-IQ")} ألف</b><span>دخل شهري تقريبي</span></div></div>
    <div class="tabs"><button data-tab="requests" class="${adminTab==='requests'?'on':''}">الطلبات (${pend.length})</button><button data-tab="users" class="${adminTab==='users'?'on':''}">المستخدمين</button><button data-tab="profit" class="${adminTab==='profit'?'on':''}">💰 الأرباح</button><button data-tab="quality" class="${adminTab==='quality'?'on':''}">⭐ الجودة</button><button data-tab="settings" class="${adminTab==='settings'?'on':''}">الإعدادات</button></div>${body}`);
  const m = $("modalBody");
  m.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ adminTab=b.dataset.tab; showAdmin(); });
  m.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{
    b.disabled = true;
    if (b.dataset.act==="approve") await sb.rpc("admin_set_plan",{p_user:b.dataset.u,p_plan:b.dataset.p,p_days:30});
    if (b.dataset.act==="points") await sb.rpc("admin_add_points",{p_user:b.dataset.u,p_pack:b.dataset.p});
    if (b.dataset.act==="free") await sb.rpc("admin_set_plan",{p_user:b.dataset.u,p_plan:"free",p_days:0});
    if (b.dataset.act==="reject") await sb.from("payment_requests").update({status:"rejected"}).eq("id",b.dataset.r);
    await loadAccount(); showAdmin();
  });
  const q = $("q"); if (q) q.oninput = () => m.querySelectorAll("#ulist .row").forEach(r=>r.style.display = r.dataset.em.includes(q.value.toLowerCase()) ? "" : "none");
  const sv = $("saveSet"); if (sv) sv.onclick = async () => {
    await sb.from("settings").update({value:$("s_method").value.trim()}).eq("key","payment_method");
    await sb.from("settings").update({value:String(+$("s_cm").value||5)}).eq("key","cost_per_msg_iqd");
    await sb.from("settings").update({value:String(+$("s_ci").value||0)}).eq("key","cost_per_img_iqd");
    const { error } = await sb.from("settings").update({value:$("s_number").value.trim()}).eq("key","payment_number");
    $("setMsg").textContent = error ? "ما انحفظ" : "✅ انحفظ"; await loadAccount();
  };
}
$("adminBtn").onclick = () => { adminTab = "requests"; showAdmin(); };


/* ===== تحديث تلقائي: إذا انرفعت نسخة جديدة، البرنامج يحدّث نفسه ===== */
async function checkUpdate(){
  if (BUILD.startsWith("__")) return;
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const { v, msg } = await r.json();
    if (!v || v === BUILD || $("updBar")) return;
    // نبيّن للمستخدم إنه اكو تحديث، وهو يختار وكت يحدّث
    const bar = document.createElement("div"); bar.id = "updBar";
    bar.innerHTML = `<div class="ub-t"><b>✨ اكو تحديث جديد ليار</b>${msg ? `<small>${esc(msg)}</small>` : ""}</div><button class="ub-go">حدّث هسه</button><button class="ub-x" aria-label="بعدين">✕</button>`;
    document.body.appendChild(bar);
    bar.querySelector(".ub-go").onclick = () => { try { localStorage.setItem("yar_upd_msg", msg || ""); } catch {} location.replace(location.pathname + "?v=" + v); };
    bar.querySelector(".ub-x").onclick = () => bar.remove();
  } catch {}
}
// بعد التحديث: نبيّن شنو الجديد مرة وحدة
try { const m = localStorage.getItem("yar_upd_msg"); if (m !== null && !BUILD.startsWith("__")) { localStorage.removeItem("yar_upd_msg"); setTimeout(() => {
  const t = document.createElement("div"); t.id = "updBar"; t.className = "done";
  t.innerHTML = `<div class="ub-t"><b>✅ يار تحدّث</b>${m ? `<small>${esc(m)}</small>` : ""}</div><button class="ub-x" aria-label="سكّر">✕</button>`;
  document.body.appendChild(t); t.querySelector(".ub-x").onclick = () => t.remove(); setTimeout(() => t.remove(), 7000); }, 900); } } catch {}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
setInterval(checkUpdate, 5 * 60 * 1000);
checkUpdate();

let wasIn = null;
function render(session){
  const inApp = !!session;
  if (inApp === wasIn) return;   // تجديد الجلسة أو الرجوع للتطبيق ما يصفّر المحادثة
  wasIn = inApp;
  $("auth").style.display = inApp ? "none" : "flex";
  $("app").style.display = inApp ? "flex" : "none";
  if (!inApp) { $("adminBtn").style.display = "none"; $("expiryBar").style.display = "none"; }
  if (inApp) {
    convId = null; curCat = "general";
    let last = null; try { last = JSON.parse(localStorage.getItem("yar_conv") || "null"); } catch {}
    sb.from("categories").select("*").order("sort").then(({data}) => {
      CATS = data || [];
      if (last?.id) openConv(last.id, last.cat);
      else sb.from("conversations").select("id,category,updated_at").order("updated_at",{ascending:false}).limit(1).then(({ data: r }) => {
        const c = r?.[0];
        if (c && Date.now() - new Date(c.updated_at).getTime() < 10 * 60 * 1000) openConv(c.id, c.category);
        else { setCatLabel(); welcome(); loadConvs(); }
      });
      try { const d = localStorage.getItem("yar_draft"); if (d) { $("input").value = d; autosize(); } } catch {}
    });
    welcome(); loadAccount();
  }
}
sb.auth.onAuthStateChange((e, s) => { render(s); if (e === "PASSWORD_RECOVERY") setTimeout(showNewPassword, 600); });
const { data: { session } } = await sb.auth.getSession(); render(session);

/* ===== زر + : كل الخصائص بقائمة وحدة ===== */
$("plusBtn").onclick = e => { e.stopPropagation(); const o = $("plusMenu").classList.toggle("open"); $("plusBtn").classList.toggle("open", o); };
document.addEventListener("click", e => { if (!e.target.closest(".plusWrap")) { $("plusMenu").classList.remove("open"); $("plusBtn").classList.remove("open"); } });
["skillBtn","attBtn","imgBtn","resBtn","thinkBtn","buildBtn","micBtn","callBtn","libBtn","iqBtn"].forEach(id => $(id).addEventListener("click", () => { $("plusMenu").classList.remove("open"); $("plusBtn").classList.remove("open"); setTimeout(refreshActive, 0); }));
function refreshActive(){
  const items = [];
  if (curCat !== "general") items.push([$("catLabel").textContent, () => { curCat = "general"; setCatLabel(); if (!convId) welcome(); }]);
  if (MODE !== "pro") items.push([$("modeLabel").textContent, () => { MODE = "pro"; try { localStorage.setItem("yar_mode", MODE); } catch {} setMode(); }]);
  if (THINK) items.push(["🧠 فكّر بعمق", () => $("thinkBtn").click()]);
  if (BUILDM) items.push(["🛠️ البنّاء", () => $("buildBtn").click()]);
  if (RESEARCH) items.push(["🔎 بحث عميق", () => $("resBtn").click()]);
  if (imgMode) items.push(["🎨 صورة", () => $("imgBtn").click()]);
  if (REC) items.unshift(["🔴 يسجّل… اضغط ✕ حتى يوكف", () => REC && REC.stop()]);
  $("activeChips").innerHTML = items.map((x,i)=>`<span>${esc(x[0])}<button type="button" data-i="${i}">✕</button></span>`).join("");
  $("activeChips").querySelectorAll("button").forEach(b => b.onclick = e => { e.stopPropagation(); items[b.dataset.i][1](); refreshActive(); });
}
document.addEventListener("click", () => setTimeout(refreshActive, 0));
$("plusMenu").addEventListener("click", () => setTimeout(refreshActive, 0), true);
setTimeout(refreshActive, 800);
</script>
