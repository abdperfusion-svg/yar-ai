name: نشر YAR AI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: رقم النسخة للتحديث التلقائي
        run: |
          export V=${GITHUB_SHA::8}
          sed -i "s/__BUILD__/$V/" index.html
          MSG="$(git log -1 --pretty=%s)" python3 -c "import json,os;json.dump({'v':os.environ['V'],'msg':os.environ['MSG'][:160]},open('version.json','w'),ensure_ascii=False)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: d
        uses: actions/deploy-pages@v4
